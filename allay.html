<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title><ruby>小学校<rt>しょうがっこう</rt></ruby>むけ <ruby>掛け算<rt>かけざん</rt></ruby>がくしゅう</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="controls">
    <div class="control-row">
      <div class="control-left">
        <div class="input-row">
          <div class="input-pair">
            <input id="rowInput" type="number" min="1" max="12" value="3" aria-label="ぎょうのかず">
            <span class="cross">×</span>
            <input id="colInput" type="number" min="1" max="12" value="3" aria-label="れつのかず">
          </div>
          <button id="generateBtn" class="make-btn" aria-label="ならべる" title="ならべる">
            <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
              <circle cx="7"  cy="7"  r="3.6" fill="#fff"/>
              <circle cx="17" cy="7"  r="3.6" fill="#fff"/>
              <circle cx="27" cy="7"  r="3.6" fill="#fff"/>
              <circle cx="7"  cy="17" r="3.6" fill="#fff"/>
              <circle cx="17" cy="17" r="3.6" fill="#fff"/>
              <circle cx="27" cy="17" r="3.6" fill="#fff"/>
              <circle cx="7"  cy="27" r="3.6" fill="#fff"/>
              <circle cx="17" cy="27" r="3.6" fill="#fff"/>
              <circle cx="27" cy="27" r="3.6" fill="#fff"/>
            </svg>
          </button>
        </div>
        <div class="palette" aria-label="いろをえらぶ">
          <div id="colorPalette" class="palette-swatches" role="group"></div>
        </div>
      </div>
      <div class="button-stack">
        <div class="buttons">
          <button id="showBtn">かけ算を ひょうじ</button>
          <button id="groupingBtn">かこいを ひょうじ</button>
          <button id="swapBtn">いれかえる</button>
          <button id="clearBtn" class="ghost-btn">いろを ぜんぶけす</button>
        </div>
        <div class="toggle-row">
          <label class="toggle">
            <input id="toggleNumbering" type="checkbox" checked>
            <span>ナンバリングを ひょうじ</span>
          </label>
        </div>
      </div>
    </div>
  </header>

  <main class="board-wrapper">
    <div class="grid-shell">
      <div class="corner"></div>
      <div id="colLabels" class="col-labels"></div>
      <div id="rowLabels" class="row-labels"></div>
      <div id="gridHolder" class="grid-holder">
        <div id="overlay" aria-live="polite"></div>
        <div id="grid" role="grid" aria-label="掛け算のグリッド"></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>


<!-- ── そうさせつめい（ヘルプ） ────────────────────────── -->
<style>
  /* ── ヘルプボタン（全教材で共通：画面右下に固定） ── */
  .help-btn {
    position: fixed;
    right: 16px;
    bottom: max(16px, env(safe-area-inset-bottom));
    width: 44px; height: 44px; margin: 0;
    border-radius: 50%; border: 3px solid #90caf9;
    background: #fff; color: #1565c0;
    font-family: inherit; font-size: 1.2rem; font-weight: 800; line-height: 1;
    padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    z-index: 190;
    box-shadow: 0 4px 14px rgba(0,0,0,.20);
    transition: background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .help-btn:hover  { background: #e3f2fd; }
  .help-btn:active { transform: translateY(1px); }
  #help-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #help-modal {
    background: #fff; border-radius: 20px; padding: 22px 28px 26px;
    max-width: 480px; width: 100%; position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
    max-height: calc(100svh - 40px); overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  /* スクロールしても閉じるボタンが隠れないよう sticky にする */
  #help-close {
    position: sticky; top: 0; display: block;
    margin: 0 -10px 4px auto;
    background: #fff; border: none; font-size: 1.2rem;
    color: #6b7280; cursor: pointer; padding: 2px 8px; z-index: 1;
  }
  #help-modal h2 { font-size: 1.1rem; font-weight: 900; color: #1565c0; margin: 0 0 14px; }
  #help-modal p  { font-size: .95rem; line-height: 2.05; color: #374151; margin: 0; }
  #help-modal rt { font-size: .58em; font-weight: 700; color: #6b7280; }
  #help-modal .sh { display: block; font-weight: 900; color: #1565c0; margin-top: 14px; margin-bottom: 2px; }
  #help-modal .sh:first-child { margin-top: 0; }
</style>

<button id="help-btn" class="help-btn" aria-label="つかいかた">?</button>
<div id="help-overlay" style="display:none">
  <div id="help-modal">
    <button id="help-close" aria-label="とじる">✕</button>
    <h2 id="help-title"></h2>
    <p id="help-body"></p>
  </div>
</div>
<script>
  (function(){
    var ov  = document.getElementById('help-overlay');
    var btn = document.getElementById('help-btn');
    var HELP = {
      title: 'かけ<ruby>算<rt>ざん</rt></ruby>（アレイ<ruby>図<rt>ず</rt></ruby>）のつかいかた',
      body:  '<span class="sh">【ならべかた】</span>ぎょうの<ruby>数<rt>かず</rt></ruby>と れつの<ruby>数<rt>かず</rt></ruby>を<ruby>入<rt>い</rt></ruby>れて、そのよこの あおい ボタンをおすと、その<ruby>数<rt>かず</rt></ruby>だけ〇がならびます。<br><span class="sh">【いろ】</span>パレットで<ruby>色<rt>いろ</rt></ruby>をえらんでから、マスをタップ・ドラッグすると <ruby>色<rt>いろ</rt></ruby>がぬれます。<br>パレットのいちばん<ruby>左<rt>ひだり</rt></ruby>（けしゴム）をえらぶと <ruby>色<rt>いろ</rt></ruby>を けせます。<br><span class="sh">【ボタン】</span>・「かけ<ruby>算<rt>ざん</rt></ruby>を ひょうじ」…しきと こたえが<ruby>出<rt>で</rt></ruby>ます<br>　ながしかくに ぬれていないときは、ながしかくの ぶんと のこりに わけて<br>　「3 × 3 + 1 = 10」のように てんせんの ボックスで<ruby>出<rt>で</rt></ruby>ます<br>・「かこいを ひょうじ」…まとまりが<ruby>見<rt>み</rt></ruby>えます<br>・「いれかえる」…しきの ぎょうと れつを<ruby>入<rt>い</rt></ruby>れかえます<br>　（「かけ<ruby>算<rt>ざん</rt></ruby>」か「かこい」を ひょうじしているときだけ つかえます）<br>・「いろを ぜんぶけす」…ぬった<ruby>色<rt>いろ</rt></ruby>を ぜんぶ けします<br>・「ナンバリングを ひょうじ」…ばんごうの<ruby>出<rt>だ</rt></ruby>し<ruby>入<rt>い</rt></ruby>れ'
    };
    btn.addEventListener('click', function(){
      document.getElementById('help-title').innerHTML = HELP.title;
      document.getElementById('help-body').innerHTML  = HELP.body;
      ov.style.display = 'flex';
    });
    document.getElementById('help-close').addEventListener('click', function(){ ov.style.display = 'none'; });
    ov.addEventListener('click', function(e){ if (e.target === ov) ov.style.display = 'none'; });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') ov.style.display = 'none'; });
  })();
</script>
</body>
</html>
