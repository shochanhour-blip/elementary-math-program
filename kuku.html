<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九九の学習</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      background: linear-gradient(160deg, #fdf4ff 0%, #f0f9ff 55%, #fefce8 100%);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 20px 0;
      gap: 12px;
    }

    /* ── Top card ────────────────────────────────────── */
    .top-card {
      flex-shrink: 0;
      width: 100%;
      max-width: 780px;
      background: white;
      border-radius: 20px;
      padding: 14px 18px 12px;
      box-shadow: 0 4px 28px rgba(139,92,246,0.10), 0 1px 6px rgba(0,0,0,0.04);
    }

    /* content-row：数直線を top-card と同じ位置に中央配置、テンキーは外に出す */
    .content-row {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: stretch;
      position: relative; /* テンキーの absolute 基準 */
    }

    /* 数直線エリア：top-card と同幅・同位置 */
    .main-area {
      flex: none;
      width: min(780px, 100%);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: 8px;
    }

    .stage-label {
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      color: #a78bfa;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
    }

    .stage-buttons {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: nowrap; /* 常に1行 — 折り返し禁止 */
    }

    .stage-btn {
      flex: 1 0 0;       /* 均等に伸縮 */
      min-width: 0;
      max-width: 50px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid #e2e8f0;
      background: #f8fafc;
      font-size: clamp(14px, 4vw, 21px);
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .stage-btn:hover { transform: scale(1.12); border-color: #a78bfa; color: #7c3aed; background: white; }

    .stage-btn[data-stage="1"].active { background:#ef4444; border-color:#ef4444; color:white; box-shadow:0 4px 14px rgba(239,68,68,.40); }
    .stage-btn[data-stage="2"].active { background:#f97316; border-color:#f97316; color:white; box-shadow:0 4px 14px rgba(249,115,22,.40); }
    .stage-btn[data-stage="3"].active { background:#f59e0b; border-color:#f59e0b; color:white; box-shadow:0 4px 14px rgba(245,158,11,.40); }
    .stage-btn[data-stage="4"].active { background:#22c55e; border-color:#22c55e; color:white; box-shadow:0 4px 14px rgba(34,197,94,.40); }
    .stage-btn[data-stage="5"].active { background:#06b6d4; border-color:#06b6d4; color:white; box-shadow:0 4px 14px rgba(6,182,212,.40); }
    .stage-btn[data-stage="6"].active { background:#3b82f6; border-color:#3b82f6; color:white; box-shadow:0 4px 14px rgba(59,130,246,.40); }
    .stage-btn[data-stage="7"].active { background:#8b5cf6; border-color:#8b5cf6; color:white; box-shadow:0 4px 14px rgba(139,92,246,.40); }
    .stage-btn[data-stage="8"].active { background:#ec4899; border-color:#ec4899; color:white; box-shadow:0 4px 14px rgba(236,72,153,.40); }
    .stage-btn[data-stage="9"].active { background:#f43f5e; border-color:#f43f5e; color:white; box-shadow:0 4px 14px rgba(244,63,94,.40); }

    /* ── Sub-controls: right-aligned below stage buttons ── */
    .sub-controls {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .toggle-btn {
      padding: 5px 13px;
      border-radius: 20px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .toggle-btn:hover { border-color: #c4b5fd; color: #7c3aed; background: white; }
    .toggle-btn.active {
      border-color: #a78bfa;
      background: #faf5ff;
      color: #7c3aed;
    }
    .toggle-btn.answers-btn.active {
      border-color: #fb923c;
      background: #fff7ed;
      color: #ea580c;
    }

    /* ── 数直線エリア：余った高さをすべて使う ─────── */
    #viz-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden; /* SVG が上方向にはみ出して top-card と重ならないよう clip */
    }
    #viz-svg { width: 100%; display: block; overflow: hidden; }

    /* ── 式エリア：ペインと数直線の間 ──────────── */
    .formula-area {
      flex-shrink: 0;
      text-align: center;
      padding: 2px 0 6px;
    }
    .formula-text {
      font-size: 40px;
      font-weight: 900;
      color: #f97316;
      letter-spacing: 0.06em;
    }
    .quiz-hint {
      font-size: 14px;
      font-weight: 600;
      color: #a78bfa;
    }

    /* ── テンキー（デフォルト：下に配置） ───────── */
    .numpad-section {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 0 max(8px, env(safe-area-inset-bottom));
      border-top: 2px solid #f0e6ff;
      width: 100%;
      max-width: 780px;
    }
    .numpad-section.visible { display: flex; }

    /* ── 広い画面（≥1280px）：top-card の右外の余白に配置 ── */
    @media (min-width: 1280px) {
      .numpad-section {
        position: absolute;
        right: 0;              /* content-row の右端に貼り付く */
        top: 50%;
        transform: translateY(-50%);
        width: 210px;
        max-width: none;
        border-top: none;
        border-left: 1px solid #e9d5ff;
        padding: 0 16px;
        background: rgba(255,255,255,0.6);
        backdrop-filter: blur(6px);
        border-radius: 16px 0 0 16px;
        box-shadow: -4px 0 20px rgba(139,92,246,0.08);
        max-height: calc(100% - 24px);
        overflow-y: auto;
      }
      .numpad-section .numpad-grid {
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
      }
      .numpad-section .np-btn { width: 100%; min-width: 0; }
    }

    .panel-formula {
      font-size: 26px;
      font-weight: 900;
      color: #f97316;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .numpad-display {
      font-size: 34px;
      font-weight: 900;
      color: #1e293b;
      min-width: 120px;
      text-align: center;
      letter-spacing: 0.12em;
      border-bottom: 3px solid #e2e8f0;
      padding-bottom: 3px;
      transition: color 0.15s;
    }
    .numpad-display.wrong   { color: #ef4444; }
    .numpad-display.correct { color: #22c55e; }

    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, var(--np-col, 62px));
      gap: 7px;
    }

    .np-btn {
      height: var(--np-btn-h, 52px);
      border-radius: 14px;
      border: none;
      background: #f8fafc;
      font-size: 24px;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      transition: transform 0.08s, background 0.08s;
      box-shadow: 0 2px 7px rgba(0,0,0,0.08);
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .np-btn:hover  { background: #f1f5f9; }
    .np-btn:active { transform: scale(0.91); }

    .np-btn.enter-btn {
      background: linear-gradient(135deg, #4ade80, #16a34a);
      color: white;
      font-size: 20px;
      box-shadow: 0 3px 10px rgba(22,163,74,0.35);
    }
    .np-btn.del-btn { color: #f87171; font-size: 20px; }

    .quiz-feedback {
      font-size: 20px;
      font-weight: 800;
      min-height: 26px;
      letter-spacing: 0.04em;
    }
    .quiz-feedback.correct { color: #22c55e; }
    .quiz-feedback.wrong   { color: #ef4444; }
  </style>
</head>
<body>

  <div class="top-card">
    <p class="stage-label">九九のだん</p>
    <div class="stage-buttons" id="stage-btns">
      <button class="stage-btn" data-stage="1">1</button>
      <button class="stage-btn" data-stage="2">2</button>
      <button class="stage-btn" data-stage="3">3</button>
      <button class="stage-btn" data-stage="4">4</button>
      <button class="stage-btn" data-stage="5">5</button>
      <button class="stage-btn" data-stage="6">6</button>
      <button class="stage-btn" data-stage="7">7</button>
      <button class="stage-btn" data-stage="8">8</button>
      <button class="stage-btn" data-stage="9">9</button>
    </div>
    <div class="sub-controls">
      <button class="toggle-btn" id="subtick-toggle">ほじょめもり</button>
      <button class="toggle-btn answers-btn" id="quiz-toggle">こたえを見る</button>
    </div>
  </div>

  <!-- content-row: 数直線エリア（中央）＋テンキー（右の余白）を横並びで管理 -->
  <div class="content-row">
    <!-- 数直線エリア（top-card と同じ幅を維持） -->
    <div class="main-area">
      <!-- 式：九九のだんペインと数直線の間 -->
      <div class="formula-area">
        <div class="formula-text" id="formula"></div>
        <div class="quiz-hint" id="quiz-hint"></div>
      </div>
      <div id="viz-container">
        <svg id="viz-svg"></svg>
      </div>
    </div>

    <!-- テンキー：数直線の右外側に配置 -->
    <div class="numpad-section" id="numpad-section">
      <div class="numpad-display" id="numpad-display">　</div>
      <div class="numpad-grid">
        <button class="np-btn" data-digit="7">7</button>
        <button class="np-btn" data-digit="8">8</button>
        <button class="np-btn" data-digit="9">9</button>
        <button class="np-btn" data-digit="4">4</button>
        <button class="np-btn" data-digit="5">5</button>
        <button class="np-btn" data-digit="6">6</button>
        <button class="np-btn" data-digit="1">1</button>
        <button class="np-btn" data-digit="2">2</button>
        <button class="np-btn" data-digit="3">3</button>
        <button class="np-btn del-btn" id="np-del">⌫</button>
        <button class="np-btn" data-digit="0">0</button>
        <button class="np-btn enter-btn" id="np-enter">↵</button>
      </div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
    </div>
  </div>

  <script>
    // ── Stage accent colors (index = stage number) ──────────────────
    var STAGE_COLORS = [
      '', '#ef4444','#f97316','#f59e0b','#22c55e',
      '#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e'
    ];

    var state = {
      stage:       null,
      selected:    null,   // こたえを見るモードで選択中
      showSubTicks: false,
      quizMode:    true,   // デフォルトは入力モード（□表示）
      activeIdx:   null,
      inputValue:  '',
      results:     {},
    };

    // ── Layout constants（高さは render() 内で動的計算） ────────────
    var LM = 24, RM = 24, N = 9;   // 左右マージン縮小でラインを広く
    var TICK_H = 14, STUB_H = 6;

    // ── SVG helpers ─────────────────────────────────────────────────
    function mkLine(x1, y1, x2, y2, stroke, sw, extra) {
      return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"'
           + ' stroke="' + stroke + '" stroke-width="' + sw + '" stroke-linecap="round"'
           + (extra ? ' ' + extra : '') + '/>';
    }
    function mkText(x, y, txt, size, fill, anchor, weight) {
      return '<text x="' + x + '" y="' + y + '" font-size="' + size + '"'
           + ' font-weight="' + (weight || '700') + '" fill="' + fill + '"'
           + ' text-anchor="' + (anchor || 'middle') + '" dominant-baseline="central"'
           + ' font-family="Hiragino Sans,Meiryo,sans-serif">' + txt + '</text>';
    }
    function mkCircle(cx, cy, r, fill, stroke, sw) {
      return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"'
           + (stroke ? ' stroke="' + stroke + '" stroke-width="' + (sw||2) + '"' : '') + '/>';
    }
    function mkClickRect(x, cy, attr, r) {
      return '<rect x="' + (x-r) + '" y="' + (cy-r) + '" width="' + (r*2) + '" height="' + (r*2) + '"'
           + ' fill="transparent" style="cursor:pointer;" ' + attr + '/>';
    }

    // ── Render ──────────────────────────────────────────────────────
    function render() {
      var container = document.getElementById('viz-container');
      var W = container.clientWidth  || 760;
      var H = container.clientHeight || 290;
      var spacing = (W - LM - RM) / N;
      // 2本の数直線の間隔を固定(70〜100px)にして、コンテナ高さによらず一定に見せる
      var lineGap = Math.max(70, Math.min(100, H * 0.4));
      var fontSize = Math.min(20, Math.max(10, Math.min(
        Math.round(spacing * 0.28),
        Math.round(H * 0.085)
      )));
      // ラベル・絵文字が SVG 上端に収まる最小 Y を確保
      // 最も高い要素は「❌️（wrong時）」: UPPER_Y の上に tick + □(bH) + gap + emoji が積まれる
      var emojiSz  = Math.min(18, Math.max(13, fontSize + 2));
      var bH_est   = Math.max(38, fontSize * 2.4);  // □の高さ（renderと同じ計算）
      var minTopPad = Math.ceil(TICK_H + bH_est + 6 + emojiSz + 18);
      var minBotPad = Math.ceil(TICK_H + fontSize * 1.5 + 8);
      var UPPER_Y = Math.max(minTopPad, Math.round(H * 0.5 - lineGap * 0.5));
      var LOWER_Y = Math.min(H - minBotPad, Math.round(H * 0.5 + lineGap * 0.5));
      var VH = H;
      var clickR = Math.min(32, Math.floor(spacing * 0.46));
      var accentColor = state.stage ? STAGE_COLORS[state.stage] : '#8b5cf6';

      function xOf(i) { return LM + i * spacing; }

      var svg = document.getElementById('viz-svg');
      svg.setAttribute('width', W);
      svg.setAttribute('height', VH);
      svg.removeAttribute('viewBox');

      var p = [];

      // ── Axis lines ──
      var lineX1 = xOf(1) - spacing * 0.45;
      var lineX2 = xOf(N) + spacing * 0.30;
      // Upper: colored with accent, lower: slate
      p.push(mkLine(lineX1, UPPER_Y, lineX2, UPPER_Y, state.stage ? accentColor + '55' : '#e2e8f0', 3));
      p.push(mkLine(lineX1, LOWER_Y, lineX2, LOWER_Y, '#cbd5e1', 3));

      // Axis labels — centered in the space before the first tick
      var labelX = LM + spacing * 0.25;
      var lblSz  = Math.min(15, Math.max(12, Math.round(fontSize * 0.9)));
      p.push(mkText(labelX, UPPER_Y,  'こたえ',   lblSz, '#a78bfa', 'middle', '800'));
      p.push(mkText(labelX, LOWER_Y, 'かける数', lblSz, '#94a3b8', 'middle', '700'));

      if (state.stage !== null) {

        // Sub-ticks (上の数直線のみ)
        if (state.showSubTicks && state.stage > 1) {
          for (var i = 1; i < N; i++) {
            var x0 = xOf(i), x1 = xOf(i + 1);
            for (var k = 1; k < state.stage; k++) {
              var stX = x0 + (x1 - x0) * k / state.stage;
              p.push(mkLine(stX, UPPER_Y - STUB_H, stX, UPPER_Y + STUB_H, accentColor + '44', 1.5));
            }
          }
        }

        // 点線（両モードで描画）
        var dotIdx  = state.quizMode ? state.activeIdx : state.selected;
        var dotColor = state.quizMode ? accentColor : '#f97316';
        if (dotIdx !== null) {
          var dash = 'stroke-dasharray="8,5"';
          p.push(mkLine(xOf(1), UPPER_Y, xOf(dotIdx), LOWER_Y, dotColor, 2.5, dash));
          if (dotIdx !== 1) p.push(mkLine(xOf(dotIdx), LOWER_Y, xOf(dotIdx), UPPER_Y, dotColor, 2.5, dash));
        }

        // ── Upper marks (積) ──
        for (var i = 1; i <= N; i++) {
          var x = xOf(i);

          if (state.quizMode) {
            var res      = state.results[i];
            var isActive = (state.activeIdx === i);
            var tickC    = res === 'correct' ? '#22c55e' : isActive ? accentColor : '#94a3b8';
            p.push(mkLine(x, UPPER_Y - TICK_H, x, UPPER_Y + TICK_H, tickC, isActive ? 3 : 2));

            if (res === 'correct') {
              // ⭕️ は数字ラベルの上に適切な間隔をあけて配置
              var numY  = UPPER_Y - TICK_H - fontSize;
              var emojiY = numY - fontSize * 0.5 - emojiSz * 0.5 - 10;
              p.push(mkCircle(x, UPPER_Y, 5, accentColor + '22', accentColor, 1.5));
              p.push(mkText(x, numY, String(state.stage * i), fontSize, '#22c55e'));
              p.push(mkText(x, emojiY, '⭕', emojiSz, '#22c55e'));
            } else {
              var bW = Math.max(38, fontSize * 2.4);
              var bH = bW; // 正方形
              var bX = x - bW / 2, bY = UPPER_Y - TICK_H - bH - 6;
              var strokeC = isActive ? accentColor : (res === 'wrong' ? '#ef4444' : '#cbd5e1');
              var fillC   = isActive ? (accentColor + '18') : (res === 'wrong' ? '#fef2f2' : 'white');
              p.push('<rect x="' + bX + '" y="' + bY + '" width="' + bW + '" height="' + bH + '"'
                   + ' rx="6" fill="' + fillC + '" stroke="' + strokeC + '" stroke-width="2"'
                   + ' style="cursor:pointer;" data-quiz-idx="' + i + '"/>');
              var dispVal = (isActive && state.inputValue) ? state.inputValue : '';
              p.push(mkText(x, bY + bH / 2, dispVal, fontSize, isActive ? accentColor : '#cbd5e1'));
              if (res === 'wrong') {
                // ❌️ は□の上に間隔をあけて配置
                var emojiY2 = bY - emojiSz * 0.5 - 10;
                p.push(mkText(x, emojiY2, '❌', emojiSz, '#ef4444'));
              }
            }
          } else {
            var isSel = (state.selected === i);
            var tickC = isSel ? '#f97316' : '#94a3b8';
            var textC = isSel ? '#f97316' : '#334155';
            p.push(mkLine(x, UPPER_Y - TICK_H, x, UPPER_Y + TICK_H, tickC, isSel ? 3 : 2));
            p.push(mkText(x, UPPER_Y - TICK_H - fontSize, String(state.stage * i), fontSize, textC));
            if (isSel) {
              p.push(mkCircle(x, UPPER_Y, 7, '#f97316'));
              p.push(mkCircle(x, UPPER_Y, 11, 'rgba(249,115,22,0.18)'));
            } else {
              p.push(mkCircle(x, UPPER_Y, 4, accentColor + '55'));
            }
          }
        }

        // ── Lower marks (かける数) ──
        for (var i = 1; i <= N; i++) {
          var x     = xOf(i);
          var isSel = (!state.quizMode && state.selected === i);
          var isAct = (state.quizMode && state.activeIdx === i);
          var dotC  = isSel ? '#f97316' : isAct ? accentColor : '#94a3b8';
          var textC = isSel ? '#f97316' : isAct ? accentColor : '#475569';
          p.push(mkLine(x, LOWER_Y - TICK_H, x, LOWER_Y + TICK_H, dotC, (isSel || isAct) ? 3 : 2));
          p.push(mkText(x, LOWER_Y + TICK_H + fontSize, String(i), fontSize, textC, 'middle', '800'));
          if (isSel) {
            p.push(mkCircle(x, LOWER_Y, 7, '#f97316'));
            p.push(mkCircle(x, LOWER_Y, 11, 'rgba(249,115,22,0.18)'));
          } else {
            p.push(mkCircle(x, LOWER_Y, 4, '#94a3b8' + '88'));
          }
        }

        // ── Clickable areas ──
        for (var i = 1; i <= N; i++) {
          var x = xOf(i);
          p.push(mkClickRect(x, UPPER_Y, 'data-idx="' + i + '"', clickR));
          p.push(mkClickRect(x, LOWER_Y, 'data-idx="' + i + '"', clickR));
          // かける数テキスト上のクリック判定
          p.push(mkClickRect(x, LOWER_Y + TICK_H + fontSize, 'data-idx="' + i + '"', clickR));
        }
      }

      svg.innerHTML = p.join('\n');

      svg.querySelectorAll('[data-idx]').forEach(function(el) {
        el.addEventListener('click', function() {
          var idx = parseInt(this.getAttribute('data-idx'));
          if (state.quizMode) {
            if (state.results[idx] === 'correct') return;
            if (state.activeIdx !== null && state.activeIdx !== idx && state.inputValue !== '') {
              submitAndMoveTo(idx);
            } else {
              setActiveIdx(idx);
            }
            return;
          }
          state.selected = (state.selected === idx) ? null : idx;
          updateFormula(); render();
        });
      });
      svg.querySelectorAll('[data-quiz-idx]').forEach(function(el) {
        el.addEventListener('click', function() {
          var idx = parseInt(this.getAttribute('data-quiz-idx'));
          if (state.results[idx] === 'correct') return;
          if (state.activeIdx !== null && state.activeIdx !== idx && state.inputValue !== '') {
            submitAndMoveTo(idx);
          } else {
            setActiveIdx(idx);
          }
        });
      });
    }

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 80);
    });

    // ── Formula / hint ──────────────────────────────────────────────
    function updateFormula() {
      var fEl = document.getElementById('formula');
      var hEl = document.getElementById('quiz-hint');
      if (state.quizMode) {
        // クイズモード：activeIdx があれば式を表示、なければヒント
        if (state.stage === null) {
          fEl.textContent = ''; hEl.textContent = 'まずだんをえらんでね';
        } else if (state.activeIdx !== null) {
          fEl.textContent = state.stage + ' × ' + state.activeIdx + ' =';
          hEl.textContent = '';
        } else {
          fEl.textContent = ''; hEl.textContent = '□ をタップしてこたえを入力しよう';
        }
      } else {
        hEl.textContent = '';
        fEl.textContent = (state.stage && state.selected)
          ? state.stage + ' × ' + state.selected + ' ='
          : '';
      }
    }

    // ── Quiz helpers ────────────────────────────────────────────────
    function setActiveIdx(idx) {
      state.activeIdx = idx; state.inputValue = '';
      clearFeedback(); updateNumpad(); updateFormula(); render();
    }

    // 別の□をタップしたとき：入力があれば即サブミットしてから移動
    function submitAndMoveTo(nextIdx) {
      var correct = parseInt(state.inputValue, 10) === state.stage * state.activeIdx;
      var answeredIdx = state.activeIdx;
      if (correct) {
        state.results[answeredIdx] = 'correct';
      } else {
        state.results[answeredIdx] = 'wrong';
      }
      setActiveIdx(nextIdx);
    }

    function updateNumpad() {
      var section = document.getElementById('numpad-section');
      var disp    = document.getElementById('numpad-display');
      var show    = state.quizMode && state.activeIdx !== null && state.stage !== null;
      section.classList.toggle('visible', show);
      if (show) {
        disp.textContent = state.inputValue || '　';
        disp.className   = 'numpad-display';
        var isRow = window.innerWidth >= 1280;
        var btnH  = isRow
          ? (window.innerHeight >= 700 ? 54 : 48)
          : (window.innerHeight >= 700 ? 44 : window.innerHeight >= 580 ? 38 : 34);
        document.documentElement.style.setProperty('--np-btn-h', btnH + 'px');
      }
      // テンキーの表示/非表示で viz-container 高さが変わるので再描画
      requestAnimationFrame(render);
    }

    function handleDigit(d) {
      if (!state.quizMode || state.activeIdx === null) return;
      if (state.inputValue.length >= 3) return;
      state.inputValue += d;
      updateNumpad(); updateFormula();
    }

    function handleDelete() {
      if (!state.quizMode || state.activeIdx === null) return;
      state.inputValue = state.inputValue.slice(0, -1);
      updateNumpad();
    }

    function submitAnswer() {
      if (!state.quizMode || state.activeIdx === null || state.inputValue === '') return;
      var correct = parseInt(state.inputValue, 10) === state.stage * state.activeIdx;
      if (correct) {
        state.results[state.activeIdx] = 'correct';
        showFeedback(true); render();
        var next = nextUnanswered(state.activeIdx);
        if (next !== null) {
          setTimeout(function() { setActiveIdx(next); }, 500);
        } else {
          state.activeIdx = null; state.inputValue = '';
          updateNumpad(); updateFormula(); showFeedback('all');
        }
      } else {
        state.results[state.activeIdx] = 'wrong';
        showFeedback(false); render();
        setTimeout(function() {
          state.inputValue = '';
          updateNumpad(); clearFeedback(); render();
        }, 700);
      }
    }

    function nextUnanswered(from) {
      for (var i = from + 1; i <= N; i++) if (state.results[i] !== 'correct') return i;
      for (var i = 1; i < from;   i++) if (state.results[i] !== 'correct') return i;
      return null;
    }

    function showFeedback(type) {
      var el   = document.getElementById('quiz-feedback');
      var disp = document.getElementById('numpad-display');
      if (type === true) {
        el.textContent = '⭕　せいかい！'; el.className = 'quiz-feedback correct';
        if (disp) { disp.textContent = String(state.stage * state.activeIdx); disp.className = 'numpad-display correct'; }
      } else if (type === false) {
        el.textContent = '✕　もういちど！'; el.className = 'quiz-feedback wrong';
        if (disp) { disp.textContent = state.inputValue; disp.className = 'numpad-display wrong'; }
      } else {
        el.textContent = '🎉　ぜんぶせいかい！'; el.className = 'quiz-feedback correct';
      }
    }

    function clearFeedback() {
      var el = document.getElementById('quiz-feedback');
      el.textContent = ''; el.className = 'quiz-feedback';
    }

    function resetQuizState() {
      state.selected = null; state.activeIdx = null;
      state.inputValue = ''; state.results = {};
      clearFeedback(); updateNumpad(); updateFormula();
    }

    // ── Stage buttons ───────────────────────────────────────────────
    document.querySelectorAll('.stage-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var stage = parseInt(this.getAttribute('data-stage'));
        document.querySelectorAll('.stage-btn').forEach(function(b) { b.classList.remove('active'); });
        state.stage = (state.stage === stage) ? null : stage;
        if (state.stage) this.classList.add('active');
        resetQuizState(); render();
      });
    });

    // ── Sub-tick toggle ─────────────────────────────────────────────
    document.getElementById('subtick-toggle').addEventListener('click', function() {
      state.showSubTicks = !state.showSubTicks;
      this.classList.toggle('active', state.showSubTicks);
      render();
    });

    // ── こたえを見る toggle ─────────────────────────────────────────
    document.getElementById('quiz-toggle').addEventListener('click', function() {
      state.quizMode = !state.quizMode;
      this.classList.toggle('active', !state.quizMode);
      resetQuizState(); render();
    });

    // ── Numpad ──────────────────────────────────────────────────────
    document.querySelectorAll('.np-btn[data-digit]').forEach(function(btn) {
      btn.addEventListener('click', function() { handleDigit(this.getAttribute('data-digit')); render(); });
    });
    document.getElementById('np-del').addEventListener('click',   function() { handleDelete(); render(); });
    document.getElementById('np-enter').addEventListener('click', submitAnswer);

    // ── Keyboard ────────────────────────────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (!state.quizMode || state.activeIdx === null) return;
      if (e.key >= '0' && e.key <= '9') { handleDigit(e.key); render(); }
      else if (e.key === 'Backspace')   { e.preventDefault(); handleDelete(); render(); }
      else if (e.key === 'Enter')       { submitAnswer(); }
    });

    // ── Init ────────────────────────────────────────────────────────
    render();
    updateFormula();
  </script>
</body>
</html>
