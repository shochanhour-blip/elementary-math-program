  function computeDivisionSteps(dividend, divisor) {
    const digits = String(dividend).split('').map(Number);
    const n = digits.length;
    const steps = [];
    let cur = 0;
    for (let col = 0; col < n; col++) {
      cur = cur * 10 + digits[col];
      if (cur < divisor && col < n - 1) continue;
      const q = Math.floor(cur / divisor);
      const p = q * divisor;
      steps.push({ col, partial: cur, q, product: p, remainder: cur - p });
      cur = cur - p;
    }
    return { digits, n, steps };
  }

  function buildHissanShell(divisor, numDigits) {
    var C  = 48;
    var nd = numDigits || 2;
    var dv = divisor != null ? divisor : '?';
    var cells = '';
    for (var i = 0; i < nd; i++)
      cells += '<div style="width:' + C + 'px;text-align:center;font-size:28px;color:#cbd5e1;">―</div>';
    return '<div style="padding:16px 20px;display:inline-flex;flex-direction:column;font-family:monospace;">'
      + '<div style="display:flex;align-items:stretch;">'
      + '<div style="width:' + C + 'px;font-size:32px;font-weight:800;color:#94a3b8;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;">' + dv + '</div>'
      + '<div style="border-top:4px solid #94a3b8;padding:4px 12px 4px 20px;display:flex;position:relative;">'
      + '<svg style="position:absolute;left:0;top:0;width:20px;height:100%;" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M 0,0 C 20,0 20,100 0,100" stroke="#94a3b8" stroke-width="4" fill="none" vector-effect="non-scaling-stroke"/></svg>'
      + cells
      + '</div></div></div>';
  }

  function buildHissanFull(dividend, divisor, quotient, remainder) {
    const { digits, n, steps } = computeDivisionSteps(dividend, divisor);
    const C = 68, BL = 28, LEAD = C + BL;
    const divisorFontSize = String(divisor).length >= 3 ? 28 : String(divisor).length >= 2 ? 34 : 44;

    const qArr = new Array(n).fill(null);
    steps.forEach(function(s) { qArr[s.col] = s.q; });

    function colBorderFull(col) {
      return col < n - 1 ? 'border-right:1px dashed rgba(148,163,184,0.4);' : '';
    }

    function cell(ch, color, size, col) {
      var sz = size || 40;
      var vis = ch !== null ? 'visible' : 'hidden';
      return '<div style="width:' + C + 'px;text-align:center;font-size:' + sz + 'px;font-weight:800;color:' + color + ';visibility:' + vis + ';' + colBorderFull(col !== undefined ? col : n) + '">' + (ch !== null ? ch : '0') + '</div>';
    }

    function placeRow(num, rightCol, color, size) {
      var s = String(num);
      var lc = Math.max(0, rightCol - s.length + 1);
      var cells = new Array(n).fill(null);
      s.split('').forEach(function(ch, i) { if (lc + i < n) cells[lc + i] = ch; });
      return cells.map(function(ch, col) { return cell(ch, color, size, col); }).join('');
    }

    function hline() {
      return '<div style="border-top:2.5px solid #94a3b8;width:' + (n * C) + 'px;margin:2px 0;"></div>';
    }

    var PLACE_NAMES_FULL = ['一', '十', '百', '千', '万'];
    var labelRow = new Array(n).fill(null).map(function(_, col) {
      var lbl = PLACE_NAMES_FULL[n - 1 - col] || '';
      return '<div style="width:' + C + 'px;text-align:center;font-size:15px;font-weight:700;color:#94a3b8;' + colBorderFull(col) + '">' + lbl + '</div>';
    }).join('');

    var qRow   = qArr.map(function(q, col) { return cell(q !== null ? String(q) : null, '#16a34a', 40, col); }).join('');
    var divRow = digits.map(function(d, col) { return cell(String(d), '#ef4444', 44, col); }).join('');

    var stHTML = '';
    steps.forEach(function(step, i) {
      if (i > 0) {
        var prevCol = steps[i - 1].col;
        var len = step.col - prevCol + 1;
        var pStr = String(step.partial).padStart(len, '0');
        var cells = new Array(n).fill(null);
        pStr.split('').forEach(function(ch, k) { cells[prevCol + k] = ch; });
        stHTML += '<div style="display:flex;">' + cells.map(function(ch, col) { return cell(ch, '#1f2937', 40, col); }).join('') + '</div>';
      }
      stHTML += '<div style="display:flex;">' + placeRow(step.product, step.col, '#1f2937') + '</div>';
      stHTML += hline();
      if (i === steps.length - 1) {
        var rc = step.remainder > 0 ? '#f97316' : '#94a3b8';
        stHTML += '<div style="display:flex;">' + placeRow(step.remainder, step.col, rc) + '</div>';
      }
    });

    var remNote = remainder > 0
      ? '<div style="margin-top:6px;font-size:18px;font-weight:800;color:#f97316;padding-left:' + LEAD + 'px;">あまり ' + remainder + '</div>'
      : '';

    return '<div style="padding:16px 20px;display:inline-flex;flex-direction:column;font-family:monospace;">'
      + '<div style="display:flex;margin-left:' + LEAD + 'px;">' + labelRow + '</div>'
      + '<div style="display:flex;margin-left:' + LEAD + 'px;">' + qRow + '</div>'
      + '<div style="display:flex;align-items:stretch;">'
      + '<div style="width:' + C + 'px;font-size:' + divisorFontSize + 'px;font-weight:800;color:#1f2933;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;">' + divisor + '</div>'
      + '<div style="border-top:4px solid #1f2933;padding:4px 4px 0 ' + BL + 'px;display:flex;position:relative;">'
      + '<svg style="position:absolute;left:0;top:0;width:' + BL + 'px;height:100%;" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M 0,0 C 20,0 20,100 0,100" stroke="#1f2933" stroke-width="4" fill="none" vector-effect="non-scaling-stroke"/></svg>'
      + divRow + '</div>'
      + '</div>'
      + '<div style="margin-left:' + LEAD + 'px;display:flex;flex-direction:column;">' + stHTML + '</div>'
      + remNote
      + '</div>';
  }

  /* ── 左ペイン連動 ── */
  function applyHlPartial(frame, ds) {
    if (frame.hlDiv.length > 1 && ds.steps.length > 0) {
      var stepDenom = Math.pow(10, ds.n - 1 - ds.steps[0].col);
      state.items.forEach(function(it) {
        if (it.value === stepDenom && it.location === 'pool') it.hlPartial = true;
      });
    }
    if (frame.hlPartialStep >= 0 && frame.hlPartialStep < ds.steps.length) {
      var hlDenom = Math.pow(10, ds.n - 1 - ds.steps[frame.hlPartialStep].col);
      state.items.forEach(function(it) {
        if (it.value === hlDenom && it.location === 'pool') it.hlPartial = true;
      });
    }
  }

  function applyHlRemainder(frame, ds) {
    if (frame.hlRem < 0) return;
    var step = ds.steps[frame.hlRem];
    if (!step || step.remainder <= 0) return;
    var denom = Math.pow(10, ds.n - 1 - step.col);
    var marked = 0;
    state.items.forEach(function(it) {
      if (it.value === denom && it.location === 'pool' && marked < step.remainder) {
        it.hlRemainder = true; marked++;
      }
    });
  }

  function syncLeftPane() {
    if (!state.hissanMode || state.hissanStepIdx < 0) return;
    if (deriveMode() !== 'equal-share') return;
    var dividend = state.total;
    var divisor  = hissanDivisorFromState();
    if (!dividend || !divisor) return;
    var frame = state.hissanFrames[state.hissanStepIdx];
    if (!frame) return;
    var ds = computeDivisionSteps(dividend, divisor);

    // 進行中のアニメーションをキャンセル
    if (pendingExchangeTimer) { clearTimeout(pendingExchangeTimer); pendingExchangeTimer = null; }
    if (pendingPostHLTimer)   { clearTimeout(pendingPostHLTimer);   pendingPostHLTimer   = null; }
    state.hissanPostHL = null;

    var prevFrame = state.hissanStepIdx > 0 ? state.hissanFrames[state.hissanStepIdx - 1] : null;
    var prevPreExch = prevFrame ? prevFrame.preExch : 0;

    // 配布アニメーションが必要なステップを検出（qShow が新たに true になった）
    var newQShowStep = -1;
    ds.steps.forEach(function(step, i) {
      if (frame.qShow[step.col] && !frame.lShow[i] && !state.hissanDistributed.has(i)) {
        if (!prevFrame || !prevFrame.qShow[step.col]) newQShowStep = i;
      }
    });

    // 進行中の配布アニメーションをキャンセル
    pendingDistribTimers.forEach(clearTimeout);
    pendingDistribTimers = [];
    isDistributing = false;
    document.querySelectorAll('.distrib-ghost, .drop-ex-ghost').forEach(function(el) { el.remove(); });

    if (frame.preExch > 0 && frame.preExch > prevPreExch) {
      // Phase 1: 元のタイルを表示 → 対象タイルがパルス点滅（0.65s × 2 = 1.3s）
      buildItems();
      var topDenom = Math.pow(10, ds.n - 1);
      state.items.forEach(function(it) {
        if (it.value === topDenom && it.location === 'pool') it.awaitingExchange = true;
      });
      renderObjects();
      renderPeople();

      pendingExchangeTimer = setTimeout(function() {
        var cls = topDenom === 100 ? 'hundred' : 'ten';
        var lbl = String(topDenom);

        // ソースタイルの画面上の位置を取得
        var srcEl   = objectsArea.querySelector('.tile-await-exchange');
        var srcRect = srcEl ? srcEl.getBoundingClientRect() : null;

        // Phase 2: 両替ゾーンを開き、ゴーストタイルをスライド
        exchangeZone.classList.add('visible');

        if (srcRect) {
          if (srcEl) srcEl.style.opacity = '0'; // 元タイルを隠す

          // ゴースト要素を body に追加（ソース位置に配置）
          var ghost = document.createElement('div');
          ghost.className = 'dot ' + cls;
          ghost.textContent = lbl;
          ghost.style.cssText =
            'position:fixed;margin:0;pointer-events:none;z-index:9999;' +
            'left:' + srcRect.left + 'px;top:' + srcRect.top + 'px;' +
            'width:' + srcRect.width + 'px;height:' + srcRect.height + 'px;' +
            'transition:left 0.75s cubic-bezier(.4,0,.2,1),top 0.75s cubic-bezier(.4,0,.2,1);';
          document.body.appendChild(ghost);

          // 2フレーム後に目的地へ移動開始（paint確定後に位置変更）
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              var dstRect = exchangeArea.getBoundingClientRect();
              ghost.style.left = (dstRect.left + (dstRect.width  - srcRect.width)  / 2) + 'px';
              ghost.style.top  = (dstRect.top  + (dstRect.height - srcRect.height) / 2) + 'px';
            });
          });

          // Phase 3: ゴースト除去 → ゾーン内にタイル静止
          pendingExchangeTimer = setTimeout(function() {
            document.body.removeChild(ghost);
            exchangeArea.innerHTML =
              '<div class="dot ' + cls + '" style="pointer-events:none;">' + lbl + '</div>';

            // Phase 4: ゾーンを閉じて両替実行 → グループがポップイン
            pendingExchangeTimer = setTimeout(function() {
              pendingExchangeTimer = null;
              exchangeZone.classList.remove('visible');
              exchangeArea.innerHTML = '<span class="exchange-hint">10 や 100 をここにドロップ</span>';
              state.animateNewGroups = true;
              syncLeftPaneToFrame(frame, ds, divisor);
              applyHlPartial(frame, ds);
              renderObjects();
              state.animateNewGroups = false;
              renderPeople();
            }, 900);
          }, 850);
        } else {
          // 位置取得失敗時のフォールバック（即座に両替）
          exchangeArea.innerHTML =
            '<div class="dot ' + cls + '" style="pointer-events:none;">' + lbl + '</div>';
          pendingExchangeTimer = setTimeout(function() {
            pendingExchangeTimer = null;
            exchangeZone.classList.remove('visible');
            exchangeArea.innerHTML = '<span class="exchange-hint">10 や 100 をここにドロップ</span>';
            state.animateNewGroups = true;
            syncLeftPaneToFrame(frame, ds, divisor);
            applyHlPartial(frame, ds);
            renderObjects();
            state.animateNewGroups = false;
            renderPeople();
          }, 900);
        }
      }, 1350);
    } else if (frame.bdStep >= 0 && frame.bdStep + 1 < ds.steps.length
               && (!prevFrame || prevFrame.bdStep !== frame.bdStep)) {
      playDropExchangeAnimation(frame, ds, divisor);
    } else if (newQShowStep >= 0) {
      playDistributeAnimation(newQShowStep, frame, ds, divisor);
    } else {
      syncLeftPaneToFrame(frame, ds, divisor);
      applyHlRemainder(frame, ds);
      applyHlPartial(frame, ds);
      renderObjects();
      renderPeople();
    }
  }

  function playDistributeAnimation(stepIdx, frame, ds, divisor) {
    // 具体物ペインが非表示のときはアニメーションをスキップして即確定
    if (state.leftMode === 'none') {
      state.hissanDistributed.add(stepIdx);
      syncLeftPaneToFrame(frame, ds, divisor);
      renderObjects();
      renderPeople();
      return;
    }

    var step     = ds.steps[stepIdx];
    var denom    = Math.pow(10, ds.n - 1 - step.col);
    var denomCls = denom === 100 ? 'hundred' : denom === 10 ? 'ten' : 'one';
    var cls      = denomCls + (denom === 1 && state.kuriMode ? ' kurai' : '');
    var lbl      = denom >= 10 ? String(denom) : (state.kuriMode ? '1' : '●');
    var tileHalf = denom === 100 ? 38 : denom === 10 ? 30 : 23;
    var STAGGER  = 160;
    var TRAVEL   = 480;
    var total    = step.q * divisor;
    // 配布完了時の枚数に基づいてサイズクラスを事前決定
    var expectedCount = step.q;
    var previewSizeClass = expectedCount >= 14 ? 'tray-xxs' : expectedCount >= 9 ? 'tray-xs' : expectedCount >= 5 ? 'tray-sm' : '';

    // 分配アニメーション中は renderPeople() 内の scalePeopleToFit() を抑制
    // （tightenZoom で zoom が変化しても tFinal 後に再計算される）
    isDistributing = true;

    // 分配前の pool 状態を構築
    // syncLeftPaneToFrame は前ステップの分配済み tiles のみ処理する。
    // 前ステップの余り (例: 残った 100-tile) はまだ高額面のまま残っているので、
    // 今回配る denomination へ cascade 両替してから描画する。
    syncLeftPaneToFrame(frame, ds, divisor);
    [100, 10].forEach(function(d) { if (d > denom) exchangePoolByDenom(d); });
    renderObjects();
    renderPeople();

    // アニメーション中にタイルが増えても収まるよう、サイズクラスを先行適用
    if (previewSizeClass) {
      peopleZone.querySelectorAll('.person-tray').forEach(function(el) {
        el.classList.add(previewSizeClass);
      });
    }

    // 配るタイルの DOM 要素を収集（空スロット除く）
    var poolTileEls = Array.from(
      objectsArea.querySelectorAll('.dot.' + denomCls + ':not(.dot-empty)')
    ).slice(0, total);

    // zoom が確定してから座標を読み取り、発射する（2パス zoom = 4 rAF 待機）
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
        // 全タイルと全トレイの位置をアニメーション開始前に確定
        var srcPositions = poolTileEls.map(function(el) {
          var r = el.getBoundingClientRect();
          return { x: r.left, y: r.top };
        });
        var dstPositions = [];
        for (var pp = 0; pp < divisor; pp++) {
          var tEl = peopleZone.querySelector('[data-tray="' + pp + '"]');
          if (tEl) {
            var r = tEl.getBoundingClientRect();
            dstPositions.push({ x: r.left + r.width / 2 - tileHalf, y: r.top + r.height / 2 - tileHalf });
          } else {
            dstPositions.push({ x: 0, y: 0 });
          }
        }

        // 各トレイへの到着数カウンタ（タイル到着のたびにラベルを更新する用）
        var arrivedCounts = new Array(divisor).fill(0);

        // 1枚ずつ round-robin で発射
        for (var t = 0; t < total; t++) {
          (function(tileIdx) {
            var person = tileIdx % divisor;
            var t1 = setTimeout(function() {
              // ① 元タイルを即座に非表示
              var srcEl = poolTileEls[tileIdx];
              if (srcEl) srcEl.style.visibility = 'hidden';

              // 発射直前に再取得（ページスクロール等のズレを防ぐ）
              var src = (function() {
                if (srcEl) { var rr = srcEl.getBoundingClientRect(); return { x: rr.left, y: rr.top }; }
                return srcPositions[tileIdx] || { x: 0, y: 0 };
              })();
              // 到着先は zoom 確定後の位置を再取得
              var dst = (function() {
                var tEl2 = peopleZone.querySelector('[data-tray="' + person + '"]');
                if (tEl2) {
                  var rr = tEl2.getBoundingClientRect();
                  return { x: rr.left + rr.width / 2 - tileHalf, y: rr.top + rr.height / 2 - tileHalf };
                }
                return dstPositions[person] || { x: 0, y: 0 };
              })();

              var ghost = document.createElement('div');
              ghost.className = 'dot ' + cls + ' distrib-ghost';
              ghost.textContent = lbl;
              ghost.style.cssText =
                'position:fixed;margin:0;z-index:9999;pointer-events:none;' +
                'left:' + src.x + 'px;top:' + src.y + 'px;' +
                'transition:left ' + TRAVEL + 'ms cubic-bezier(.4,0,.2,1),' +
                         'top '  + TRAVEL + 'ms cubic-bezier(.4,0,.2,1);';
              document.body.appendChild(ghost);

              requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                  ghost.style.left = dst.x + 'px';
                  ghost.style.top  = dst.y + 'px';
                });
              });

              // ② ghost 到着 → tray にタイルを追加してカウント更新
              var t2 = setTimeout(function() {
                if (ghost.parentNode) ghost.parentNode.removeChild(ghost);

                var trayEl2 = peopleZone.querySelector('[data-tray="' + person + '"]');
                if (trayEl2) {
                  var animTile = document.createElement('div');
                  animTile.className = 'dot ' + cls;
                  animTile.textContent = lbl;
                  animTile.style.pointerEvents = 'none';
                  trayEl2.appendChild(animTile);

                  arrivedCounts[person]++;
                  var countEl = trayEl2.nextElementSibling; // .tray-count
                  if (countEl) countEl.textContent = (arrivedCounts[person] * denom) + 'こ';
                  tightenZoom(peopleZone);
                }
              }, TRAVEL + 60);
              pendingDistribTimers.push(t2);
            }, tileIdx * STAGGER);
            pendingDistribTimers.push(t1);
          })(t);
        }

        // 全タイル完了後に配分確定して再描画・zoom 再計算
        var tFinal = setTimeout(function() {
          isDistributing = false;
          state.hissanDistributed.add(stepIdx);
          syncLeftPaneToFrame(frame, ds, divisor);
          renderObjects();
          renderPeople(); // isDistributing=false → scalePeopleToFit() が走る
        }, total * STAGGER + TRAVEL + 120);
        pendingDistribTimers.push(tFinal);
          });
        });
      });
    });
  }

  function exchangePoolByDenom(d) {
    state.items
      .filter(function(it) { return it.value === d && it.location === 'pool'; })
      .map(function(it) { return it.id; })
      .forEach(function(id) {
        var it = state.items.find(function(x) { return x.id === id; });
        if (it) exchangeItem(it);
      });
  }

  function playPostDropHL(frame, ds, divisor) {
    if (pendingPostHLTimer) { clearTimeout(pendingPostHLTimer); pendingPostHLTimer = null; }
    var bdIdx      = frame.bdStep;
    var lowerDenom = Math.pow(10, ds.n - 1 - ds.steps[bdIdx + 1].col);
    var PHASE_MS   = 2200;

    // Phase A: 下ろした数字（bracket の partial 行）+ 対応する pool タイルをオレンジで点滅
    state.hissanPostHL = { phase: 'drop', bdIdx: bdIdx, lowerDenom: lowerDenom };
    renderHissanBracket();
    renderObjects();

    pendingPostHLTimer = setTimeout(function() {
      // Phase B: 引き算の結果（bracket の余り行）+ 両替グループをブルーで点滅
      state.hissanPostHL = { phase: 'exch', bdIdx: bdIdx, lowerDenom: lowerDenom };
      renderHissanBracket();
      renderObjects();

      pendingPostHLTimer = setTimeout(function() {
        pendingPostHLTimer = null;
        state.hissanPostHL = null;
        renderHissanBracket();
        renderObjects();
      }, PHASE_MS);
    }, PHASE_MS);
  }

  function playDropExchangeAnimation(frame, ds, divisor) {
    // 具体物ペインが非表示のときはアニメーションをスキップして即確定
    if (state.leftMode === 'none') {
      syncLeftPaneToFrame(frame, ds, divisor);
      renderObjects();
      renderPeople();
      return;
    }

    var n = ds.n, steps = ds.steps;

    // プレ両替状態を構築（bdStep の両替は適用しない）
    buildItems();
    if (frame.preExch > 0) {
      for (var ex = 0; ex < frame.preExch; ex++) exchangePoolByDenom(Math.pow(10, n - 1 - ex));
    }
    steps.forEach(function(step, i) {
      if (!frame.lShow[i] && !state.hissanDistributed.has(i)) return;
      var denom = Math.pow(10, n - 1 - step.col);
      [100, 10].forEach(function(d) { if (d > denom) exchangePoolByDenom(d); });
      for (var p = 0; p < divisor; p++) {
        var given = 0;
        for (var j = 0; j < state.items.length && given < step.q; j++) {
          var it = state.items[j];
          if (it.value === denom && it.location === 'pool') { it.location = p; given++; }
        }
      }
    });

    var bdIdx       = frame.bdStep;
    var higherDenom = Math.pow(10, n - 1 - steps[bdIdx].col);
    var lowerDenom  = Math.pow(10, n - 1 - steps[bdIdx + 1].col);
    var exchangeRate = higherDenom / lowerDenom;
    var higherCls   = higherDenom === 100 ? 'hundred' : 'ten';
    var lowerCls    = lowerDenom  === 100 ? 'hundred' : lowerDenom === 10 ? 'ten' : 'one kurai';
    var lowerLbl    = lowerDenom  >= 10 ? String(lowerDenom) : (state.kuriMode ? '1' : '●');

    // 両替対象タイルを収集
    var toExchange = state.items.filter(function(it) {
      return it.value === higherDenom && it.location === 'pool';
    });

    if (toExchange.length === 0) {
      syncLeftPaneToFrame(frame, ds, divisor);
      renderObjects(); renderPeople(); return;
    }

    // Phase 1: 対象タイルをパルス点滅（待機アニメーション）
    toExchange.forEach(function(it) { it.awaitingExchange = true; });
    renderObjects(); renderPeople();

    var PAUSE_MS      = 1300;  // 点滅完了まで待機（0.65s × 2）
    var TRANSITION_MS = 320;   // exchange-slider の CSS transition（0.3s）+ 余裕
    var TRAVEL_MS     = 800;
    var SHOW_MS       = 900;
    var BETWEEN_MS    = 250;

    var tileQueue = toExchange.slice();

    pendingExchangeTimer = setTimeout(function() {
      // 点滅完了 → ゾーンを開いてトランジションを待つ
      toExchange.forEach(function(it) { delete it.awaitingExchange; });
      exchangeZone.classList.add('visible');

      pendingExchangeTimer = setTimeout(function() {
        // ゾーンが完全に開ききった（dstRect 確定）

        function runNextTile() {
          if (tileQueue.length === 0) {
            exchangeZone.classList.remove('visible');
            exchangeArea.innerHTML = '<span class="exchange-hint">10 や 100 をここにドロップ</span>';
            syncLeftPaneToFrame(frame, ds, divisor);
            applyHlPartial(frame, ds);
            renderObjects(); renderPeople();
            return;
          }
          var tile = tileQueue.shift();

          var srcEl   = objectsArea.querySelector('.dot.' + higherCls);
          var srcRect = srcEl ? srcEl.getBoundingClientRect() : null;
          var dstRect = exchangeArea.getBoundingClientRect();

          if (srcRect) {
            // タイルを pool から除外し、除いた状態で再描画（並び順を維持）
            tile.location = '__done__';
            var ghost = document.createElement('div');
            ghost.className = 'dot ' + higherCls + ' drop-ex-ghost';
            ghost.textContent = String(higherDenom);
            ghost.style.cssText = 'position:fixed;margin:0;pointer-events:none;z-index:9999;'
              + 'left:' + srcRect.left + 'px;top:' + srcRect.top + 'px;'
              + 'width:' + srcRect.width + 'px;height:' + srcRect.height + 'px;'
              + 'transition:left 0.75s cubic-bezier(.4,0,.2,1),top 0.75s cubic-bezier(.4,0,.2,1);';
            document.body.appendChild(ghost);
            renderObjects(); // __done__ タイルを除いた pool を再描画

            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                ghost.style.left = (dstRect.left + (dstRect.width  - srcRect.width)  / 2) + 'px';
                ghost.style.top  = (dstRect.top  + (dstRect.height - srcRect.height) / 2) + 'px';
              });
            });

            pendingExchangeTimer = setTimeout(function() {
              if (ghost.parentNode) document.body.removeChild(ghost);

              // 両替結果を表示（ゾーンは開いたまま innerHTML だけ更新）
              var exHtml = '';
              for (var k = 0; k < exchangeRate; k++) {
                exHtml += '<div class="dot ' + lowerCls + '" style="pointer-events:none;">' + lowerLbl + '</div>';
              }
              exchangeArea.innerHTML = exHtml;

              pendingExchangeTimer = setTimeout(function() {
                exchangeArea.innerHTML = '<span class="exchange-hint">10 や 100 をここにドロップ</span>';
                // tile の位置にグループを splice で差し込む（囲い付き・並び順維持）
                var tileIdx  = state.items.indexOf(tile);
                var groupId  = state.nextGroupId++;
                var groupColor = higherDenom === 100 ? '#7c3aed' : '#f59e0b';
                state.groups.set(groupId, { color: groupColor, capacity: exchangeRate, itemValue: lowerDenom });
                var newGroupTiles = [];
                for (var k = 0; k < exchangeRate; k++) {
                  newGroupTiles.push({ id: state.nextId++, value: lowerDenom, location: 'pool',
                                       groupId: groupId, groupColor: groupColor });
                }
                state.items.splice(tileIdx, 1, ...newGroupTiles);
                state.animateNewGroups = true;
                renderObjects();
                state.animateNewGroups = false;
                pendingExchangeTimer = setTimeout(runNextTile, BETWEEN_MS);
              }, SHOW_MS);
            }, TRAVEL_MS);
          } else {
            // フォールバック（位置取得失敗）
            tile.location = '__done__';
            renderObjects();
            pendingExchangeTimer = setTimeout(runNextTile, BETWEEN_MS);
          }
        }

        runNextTile();
      }, TRANSITION_MS);
    }, PAUSE_MS);
  }

  function syncLeftPaneToFrame(frame, ds, divisor) {
    var n = ds.n, steps = ds.steps;
    buildItems();

    // 予備フレーム（最上位が割れない）：上の位から順に両替して位を合わせる
    if (frame.preExch > 0) {
      for (var ex = 0; ex < frame.preExch; ex++) {
        exchangePoolByDenom(Math.pow(10, n - 1 - ex));
      }
    }

    // コミット済みステップ：必要なら上位タイルを両替してから配る
    steps.forEach(function(step, i) {
      if (!frame.lShow[i] && !state.hissanDistributed.has(i)) return;
      var denom = Math.pow(10, n - 1 - step.col);
      // この位より大きいタイルをすべて両替（カスケード）
      [100, 10].forEach(function(d) { if (d > denom) exchangePoolByDenom(d); });
      // 各トレイへ配る
      for (var p = 0; p < divisor; p++) {
        var given = 0;
        for (var j = 0; j < state.items.length && given < step.q; j++) {
          var it = state.items[j];
          if (it.value === denom && it.location === 'pool') { it.location = p; given++; }
        }
      }
    });

    // おろすステップ：次の位へ向けて残タイルを両替（視覚的な両替演出）
    if (frame.bdStep >= 0 && frame.bdStep + 1 < steps.length) {
      var nextDenom = Math.pow(10, n - 1 - steps[frame.bdStep + 1].col);
      [100, 10].forEach(function(d) { if (d > nextDenom) exchangePoolByDenom(d); });
    }
  }


  /* ── 答えを確認 ── */
  checkBtn.addEventListener('click', () => {
    const mode = deriveMode();
    if (!mode) return;
    const count = getPeopleCount();

    if (mode === 'equal-share') {
      const expected  = Math.floor(state.total / state.people);
      const remainder = state.total % state.people;
      const remStr    = remainder > 0 ? ` あまり ${remainder}` : '';
      const formula   = `${state.total} ÷ ${state.people} = ${expected}${remStr}`;
      const allOk  = Array.from({ length: count }, (_, i) => traySum(i)).every(s => s === expected);
      const poolOk = poolSum() === remainder;

      showRemainder(remainder);
      showFeedback(formula);

    } else {
      const expected  = Math.floor(state.total / state.perPerson);
      const remainder = state.total % state.perPerson;
      const remStr    = remainder > 0 ? ` あまり ${remainder}` : '';
      const formula   = `${state.total} ÷ ${state.perPerson} = ${expected}${remStr}`;

      showRemainder(remainder);
      showFeedback(formula);
    }
  });

  function showRemainder(rem) {
    if (rem > 0) {
      remainderValue.textContent = rem;
      remainderDisplay.style.display = 'flex';
    } else {
      remainderDisplay.style.display = 'none';
    }
  }

  function showFeedback(formula) {
    feedbackEl.className = 'feedback show';
    feedbackEl.textContent = formula;
  }
  function hideFeedback() {
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    remainderDisplay.style.display = 'none';
  }

  /* ── リセット ── */
  resetBtn.addEventListener('click', () => {
    totalInput.value  = '';
    peopleInput.value = '';
    perInput.value    = '';
    state.total = state.people = state.perPerson = null;
    state.extraPeople = 1;
    state.leftMode      = 'maru';
    state.kuriMode      = false;
    state.hissanMode    = false;
    state.hissanStepIdx = -1;
    state.hissanFrames  = [];
    state.nextGroupId = 0;
    state.groups.clear();
    state.personIcons = [];
    applyModeState();
    buildItems();
    remainderDisplay.style.display = 'none';
    checkBtn.disabled = true;
    hideFeedback();
    renderAll();
  });
  // キーボード ← → で筆算ステップを操作
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return; // 入力欄フォーカス中は無効
    if (!state.hissanMode) return;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      stopAutoPlay();
      var btn = document.getElementById('hissanNextBtn') || document.getElementById('hissanStartBtn');
      if (btn && !btn.disabled) btn.click();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      stopAutoPlay();
      var btn = document.getElementById('hissanPrevBtn');
      if (btn && !btn.disabled) btn.click();
    }
  });

  // ウィンドウリサイズ時にスケールを再計算
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function() {
      scaleHissanToFit();
      scaleLeftPaneToFit();
    });
    ro.observe(document.querySelector('.app-layout') || document.body);
  } else {
    window.addEventListener('resize', function() {
      scaleHissanToFit();
      scaleLeftPaneToFit();
    });
  }
</script>
</div><!-- #pageWrap -->
</body>
</html>
