<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わり算 — 具体物で考えよう</title>
  <style>
    :root {
      --panel:   #fff;
      --text:    #1f2933;
      --shadow:  0 6px 18px rgba(0,0,0,0.08);
      /* 入力欄の色 */
      --c-total:  #ef4444;   /* 赤 — ぜんぶの数 */
      --c-people: #3b82f6;   /* 青 — 人数 */
      --c-per:    #22c55e;   /* 緑 — 1人分の数 */
      --c-rem:    #f97316;   /* 橙 — あまり */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "Noto Sans JP","Helvetica Neue",Arial,sans-serif;
      background: #f3f4f6;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
    }

    /* ── コントロールパネル ── */
    .controls {
      width: 100%;
      padding: 16px 20px;
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .inputs-row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    /* ラベル＋入力を横並び */
    .input-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
    }
    .input-chip label {
      white-space: nowrap;
      font-size: 15px;
      font-weight: 800;
    }
    .input-chip input {
      width: 76px;
      padding: 6px 8px;
      font-size: 22px;
      font-weight: 700;
      border: 3px solid currentColor;
      border-radius: 12px;
      text-align: center;
      background: #fff;
      transition: box-shadow .15s;
    }
    .input-chip input:focus { outline: none; box-shadow: 0 0 0 3px rgba(0,0,0,.12); }

    /* 色テーマ */
    .chip-total  { background: #fef2f2; color: var(--c-total); }
    .chip-people { background: #eff6ff; color: var(--c-people); }
    .chip-per    { background: #f0fdf4; color: var(--c-per); }

    /* あまり表示 */
    .remainder-block {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 50px;
      background: #fff7ed;
      color: var(--c-rem);
      font-size: 15px;
      font-weight: 800;
    }
    .remainder-block span {
      font-size: 22px;
      background: #fff;
      border: 3px solid var(--c-rem);
      border-radius: 10px;
      padding: 3px 10px;
      min-width: 44px;
      text-align: center;
    }

    /* ボタン行 */
    .controls-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .mode-btn {
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 700;
      border: 2px solid #d1d5db;
      border-radius: 50px;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: transform .05s, background .15s, color .15s, border-color .15s;
    }
    .mode-btn:active { transform: translateY(1px); }
    #maruBtn.on  { background: #16a34a; color: #fff; border-color: #16a34a; }
    #kuraiBtn.on { background: #7c3aed; color: #fff; border-color: #7c3aed; }
    #hissanBtn.on { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
    .reset-btn {
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 700;
      border: 2px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: transform .05s;
      margin-left: auto;
    }
    .reset-btn:active { transform: translateY(1px); }
    .check-btn {
      padding: 9px 22px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg,#fbbf24,#f97316);
      color: #fff;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .05s, opacity .15s;
    }
    .check-btn:active { transform: translateY(1px); }
    .check-btn:disabled { opacity: .35; cursor: default; }

    /* ── フィードバック ── */
    .feedback {
      width: 100%;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 36px;
      font-weight: 800;
      text-align: center;
      display: none;
    }
    .feedback.show { display:block; background:#f0f4ff; color:#1f2933; border:3px solid #93c5fd; }

    /* ── ゾーン共通 ── */
    .zone {
      width: 100%;
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }
    .zone-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .06em;
      margin-bottom: 12px;
    }
    .placeholder { color: #bbb; font-size: 14px; }

    /* ── ぜんぶの数ゾーン ── */
    .zone-objects {
      background: #fff1f1;
      border: 3px solid #fca5a5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .zone-objects .zone-title { color: var(--c-total); }
    .objects-area {
      min-height: 40px;
      flex: 1 1 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
      border-radius: 12px;
      padding: 6px;
      transition: background .15s;
      overflow: hidden;
    }
    .objects-area.drag-over { background: #fecaca; }

    /* ── ドット ── */
    .dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      touch-action: none;
      font-weight: 800;
      transition: transform .08s;
    }
    .dot:active { cursor: grabbing; }
    .dot.one {
      width: 46px; height: 46px;
      font-size: 26px;
      background: var(--c-total);
      color: #fff;
      border-radius: 50%;
      box-shadow: 0 3px 0 #b91c1c;
    }
    .dot.one.kurai {
      background: #7c3aed;
      box-shadow: 0 3px 0 #5b21b6;
      font-size: 22px;
    }
    .dot.ten {
      width: 60px; height: 60px;
      font-size: 30px;
      background: #f59e0b;
      color: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 0 #b45309;
    }
    .dot.hundred {
      width: 76px; height: 76px;
      font-size: 28px;
      background: #7c3aed;
      color: #fff;
      border-radius: 16px;
      box-shadow: 0 5px 0 #4c1d95;
    }
    /* トレイ内は小さめ */
    .person-tray .dot.one     { width: 36px; height: 36px; font-size: 20px; box-shadow: 0 2px 0 #b91c1c; }
    .person-tray .dot.one.kurai { box-shadow: 0 2px 0 #5b21b6; font-size: 16px; }
    .person-tray .dot.ten     { width: 48px; height: 48px; font-size: 24px; box-shadow: 0 3px 0 #b45309; }
    .person-tray .dot.hundred { width: 60px; height: 60px; font-size: 22px; box-shadow: 0 3px 0 #4c1d95; }
    /* タイル数が多いときは縮小（5枚〜） */
    .tray-sm .dot.one     { width: 28px; height: 28px; font-size: 15px; box-shadow: 0 2px 0 #b91c1c; }
    .tray-sm .dot.one.kurai { font-size: 12px; }
    .tray-sm .dot.ten     { width: 36px; height: 36px; font-size: 17px; box-shadow: 0 2px 0 #b45309; }
    .tray-sm .dot.hundred { width: 46px; height: 46px; font-size: 15px; box-shadow: 0 2px 0 #4c1d95; }
    /* タイル数が多いときは縮小（9枚〜） */
    .tray-xs .dot.one     { width: 22px; height: 22px; font-size: 11px; box-shadow: 0 1px 0 #b91c1c; }
    .tray-xs .dot.one.kurai { font-size: 9px; }
    .tray-xs .dot.ten     { width: 28px; height: 28px; font-size: 13px; box-shadow: 0 1px 0 #b45309; }
    .tray-xs .dot.hundred { width: 36px; height: 36px; font-size: 12px; box-shadow: 0 2px 0 #4c1d95; }
    /* タイル数が多いときは縮小（14枚〜） */
    .tray-xxs .dot.one     { width: 16px; height: 16px; font-size: 8px; box-shadow: none; }
    .tray-xxs .dot.one.kurai { font-size: 7px; }
    .tray-xxs .dot.ten     { width: 22px; height: 22px; font-size: 10px; box-shadow: 0 1px 0 #b45309; }
    .tray-xxs .dot.hundred { width: 28px; height: 28px; font-size: 9px;  box-shadow: 0 1px 0 #4c1d95; }
    .dot.dragging  { opacity: .2; }
    .dot.dot-empty {
      background:  transparent !important;
      box-shadow:  none !important;
      border:      2px dashed rgba(0,0,0,.18);
      cursor:      default;
    }

    /* ── 人ゾーン ── */
    .zone-people {
      background: #eff6ff;
      border: 3px solid #93c5fd;
      flex: 1 1 50%;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .zone-people .zone-title { color: var(--c-people); }
    .people-zone {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-start;
      align-content: flex-start;
      overflow: hidden;
    }
    .people-adjuster {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 800;
      width: 100%;
      margin-bottom: 6px;
      color: var(--c-people);
    }
    .adj-btn {
      width: 36px; height: 36px;
      font-size: 22px;
      border: 3px solid var(--c-people);
      border-radius: 50%;
      background: #fff;
      color: var(--c-people);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      transition: transform .05s;
    }
    .adj-btn:active { transform: translateY(1px); }
    .person-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .person-icon { font-size: 42px; line-height: 1; user-select: none; }
    .person-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--c-people);
    }
    .person-tray {
      min-width: 86px;
      min-height: 60px;
      border: 3px dashed #93c5fd;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px;
      align-content: flex-start;
      transition: background .12s, border-color .12s;
    }
    .person-tray.drag-over {
      background: #bfdbfe;
      border-color: var(--c-people);
      border-style: solid;
    }
    .tray-count {
      font-size: 14px;
      font-weight: 800;
      color: var(--c-people);
      min-height: 20px;
    }

    /* トレイカラー（人ごと） */
    .tray-0 { background: #fef9c3; border-color: #fde047; }
    .tray-1 { background: #fce7f3; border-color: #f9a8d4; }
    .tray-2 { background: #dcfce7; border-color: #86efac; }
    .tray-3 { background: #ffedd5; border-color: #fdba74; }
    .tray-4 { background: #ede9fe; border-color: #c4b5fd; }
    .tray-5 { background: #cffafe; border-color: #67e8f9; }

    /* ── ぜんぶの数 + りょうがえ の横並び行 ── */
    .zone-row {
      width: 100%;
      display: flex;
      gap: 0;
      align-items: stretch;
      flex: 1 1 50%;
      min-height: 0;
      overflow: hidden;
    }
    .zone-row > .zone-objects {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      width: auto;
      display: flex;
      flex-direction: column;
    }
    /* りょうがえスライダー（幅アニメーション用ラッパー） */
    .exchange-slider {
      flex: 0 0 0px;
      overflow: hidden;
      transition: flex-basis .3s ease, margin-left .3s ease;
      margin-left: 0;
    }
    .exchange-slider.visible {
      flex: 0 0 180px;
      margin-left: 14px;
    }

    /* ── りょうがえゾーン（内側） ── */
    .zone-exchange {
      width: 180px;          /* slider に合わせた固定幅 */
      height: 100%;
      background: #fdf4ff;
      border: 3px dashed #c084fc;
    }
    .zone-exchange .zone-title { color: #7c3aed; font-size: 12px; }
    .exchange-area {
      min-height: 60px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
      border-radius: 10px;
      padding: 6px;
      transition: background .15s;
    }
    .exchange-area.drag-over {
      background: #ede9fe;
    }
    .exchange-hint {
      color: #a78bfa;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
    }
    /* りょうがえされたグループの枠 */
    .exchange-group {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px;
      border-radius: 12px;
      border: 3px solid;
    }

    /* ── 両替アニメーション ── */
    @keyframes tile-await-pulse {
      0%   { transform: scale(1);    box-shadow: 0 0 0 0    rgba(245,158,11,0); }
      45%  { transform: scale(1.22); box-shadow: 0 0 0 10px rgba(245,158,11,0.6); }
      100% { transform: scale(1);    box-shadow: 0 0 0 0    rgba(245,158,11,0); }
    }
    .tile-await-exchange {
      animation: tile-await-pulse 0.65s ease-in-out 2;
      position: relative; z-index: 1;
    }
    .tile-hl-partial {
      outline: 3px solid #fbbf24;
      outline-offset: 2px;
      filter: drop-shadow(0 0 5px rgba(251,191,36,0.7));
    }
    .pool-hl-wrapper {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 6px;
      padding: 8px;
      border: 3px solid #fbbf24;
      border-radius: 14px;
      background: rgba(251,191,36,0.08);
    }
    @keyframes rem-pulse {
      0%,100% { border-color: #fbbf24; box-shadow: 0 0 0 0 rgba(251,191,36,0); }
      50%     { border-color: #fff;    box-shadow: 0 0 0 0 rgba(251,191,36,0); }
    }
    .pool-hl-remainder {
      animation: rem-pulse 1.1s ease-in-out infinite;
    }
    @keyframes cell-rem-pulse {
      0%,100% { outline: 3px solid #fbbf24; outline-offset: 2px; }
      50%     { outline: 3px solid #fff;    outline-offset: 2px; }
    }
    .hissan-rem-hl {
      animation: cell-rem-pulse 1.1s ease-in-out infinite;
      border-radius: 6px;
    }
    .tile-hl-remainder {
      animation: cell-rem-pulse 1.1s ease-in-out infinite;
      border-radius: 6px;
    }
    @keyframes drop-hl-pulse {
      0%,100% { outline: 3px solid #f97316; outline-offset: 2px; }
      50%     { outline: 3px solid #fff;    outline-offset: 2px; }
    }
    .hissan-drop-hl, .tile-hl-drop {
      animation: drop-hl-pulse 1.1s ease-in-out infinite;
      border-radius: 6px;
    }
    @keyframes exch-hl-pulse {
      0%,100% { outline: 3px solid #0ea5e9; outline-offset: 2px; }
      50%     { outline: 3px solid #fff;    outline-offset: 2px; }
    }
    .hissan-exch-hl, .tile-hl-exch, .group-hl-exch {
      animation: exch-hl-pulse 1.1s ease-in-out infinite;
      border-radius: 14px;
    }
    .hissan-drop-hl, .tile-hl-drop { border-radius: 6px; }
    .hissan-exch-hl                { border-radius: 6px; }
    .hl-mul  { background: rgba(124,58,237,0.22) !important; border-radius: 6px; }
    .hl-prod { background: rgba(234,88,12,0.22)  !important; border-radius: 6px; }
    @keyframes drop-digit-pulse {
      0%,100% { outline: 3px solid #fbbf24; outline-offset: 2px; }
      50%     { outline: 3px solid #fff;    outline-offset: 2px; }
    }
    .hissan-drop-digit {
      animation: drop-digit-pulse 1.1s ease-in-out infinite;
      border-radius: 6px;
    }
    @keyframes drop-arrow-anim {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.1; }
    }
    .drop-arrow-overlay {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      overflow: visible;
      animation: drop-arrow-anim 1.1s ease-in-out infinite;
      margin-top: 3px;
    }
    @keyframes exchange-group-pop {
      0%   { transform: scale(0.55); opacity: 0; }
      65%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1);    opacity: 1; }
    }
    .exchange-group-new {
      animation: exchange-group-pop 0.45s cubic-bezier(.17,.67,.46,1.2);
    }

    /* ── ゴースト ── */
    .ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      opacity: .9;
      transform: scale(1.18) rotate(6deg);
      transition: none;
    }

    /* ── ページ幅ラッパー ── */
    #pageWrap {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 14px 12px;
      overflow: hidden;
    }

    /* ── 筆算モード レイアウト ── */
    .app-layout {
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      display: flex;
      gap: 16px;
      align-items: stretch;
      overflow: hidden;
    }
    .left-pane {
      flex: 1 1 100%;
      display: flex;
      flex-direction: column;
      transition: flex-basis .35s ease;
      min-width: 0;
      overflow: hidden;
      min-height: 0;
    }
    #leftPaneContent {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 0;
      min-height: 0;
    }
    .app-layout.hissan-active .left-pane {
      flex: 1 1 58%;
      overflow: hidden;
    }
    .right-pane {
      flex: 0 0 0px;
      overflow: hidden;
      opacity: 0;
      transition: flex-basis .35s ease, opacity .3s ease;
      min-width: 0;
      min-height: 0;
    }
    .app-layout.hissan-active .right-pane {
      flex: 1 1 34%;
      overflow: hidden;
      opacity: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* 筆算ボタン */
    /* 左ペイン非表示状態 */
    .app-layout.left-pane-off .left-pane {
      flex: 0 0 0 !important;
      overflow: hidden;
      opacity: 0;
      min-width: 0;
    }
    .app-layout.left-pane-off.hissan-active .right-pane {
      flex: 1 1 auto;
      max-width: none;
    }

    /* ── ステップインジケーター ── */
    .step-indicator {
      display: none;
      flex-direction: column;
      gap: 10px;
      flex: 0 0 130px;
      padding: 16px 0 0;
      align-self: stretch;
    }
    .app-layout.hissan-active .step-indicator { display: flex; }
    .step-item {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      border-radius: 14px;
      font-size: 26px;
      font-weight: 900;
      color: #cbd5e1;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      text-align: center;
      transition: color .2s, background .2s, border-color .2s;
      letter-spacing: .05em;
    }
    .step-item.active { background:#ffe4e6; border-color:#fca5a5; color:#991b1b; }

    /* ── 筆算ゾーン ── */
    .zone-hissan {
      background: #f0f9ff;
      border: 3px solid #7dd3fc;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #hissanDisplay {
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 8px 12px;
    }
    #hissanBracketDisplay {
      display: inline-block;
      transform-origin: top left;
    }
    .zone-hissan .zone-title { color: #0284c7; }

    /* ── 筆算 入力バー ── */
    .hissan-inputs-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: #e0f2fe;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .hissan-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 700;
    }
    .hissan-chip label { white-space: nowrap; }
    .hissan-chip input {
      width: 58px;
      padding: 4px 6px;
      font-size: 18px;
      font-weight: 700;
      border: 2.5px solid currentColor;
      border-radius: 8px;
      text-align: center;
      background: #fff;
    }
    .hissan-chip input:focus { outline: none; box-shadow: 0 0 0 3px rgba(0,0,0,.1); }
    .hissan-chip-total  { background: #fef2f2; color: var(--c-total); }
    .hissan-chip-people { background: #eff6ff; color: var(--c-people); }
    .hissan-div-op { font-size: 20px; font-weight: 800; color: #64748b; }
  </style>
</head>
<body>

<div id="pageWrap">
<header class="controls">
  <div class="inputs-row">
    <div class="input-chip chip-total">
      <label for="totalInput">ぜんぶの数</label>
      <input id="totalInput" type="number" min="1" max="999">
    </div>
    <div class="input-chip chip-people">
      <label for="peopleInput">人数</label>
      <input id="peopleInput" type="number" min="1" max="30">
    </div>
    <div class="input-chip chip-per">
      <label for="perInput">１人分の数</label>
      <input id="perInput" type="number" min="1" max="100">
    </div>
    <div id="remainderDisplay" class="remainder-block">
      あまり <span id="remainderValue">0</span>
    </div>
  </div>
  <div class="controls-actions">
    <button id="maruBtn"  class="mode-btn on">まる</button>
    <button id="kuraiBtn" class="mode-btn">くらい</button>
    <button id="hissanBtn" class="mode-btn">ひっさん</button>
    <button id="resetBtn" class="reset-btn">リセット</button>
    <button id="checkBtn" class="check-btn" disabled>式を確認</button>
  </div>
</header>

<div id="feedback" class="feedback"></div>

<div class="app-layout" id="appLayout">
  <div class="left-pane">
    <div id="leftPaneContent">
      <div class="zone-row">
        <section class="zone zone-objects">
          <div class="zone-title">ぜんぶの数</div>
          <div id="objectsArea" class="objects-area">
            <span class="placeholder">「ぜんぶの数」を入力すると●があらわれます</span>
          </div>
        </section>

        <div class="exchange-slider" id="exchangeZone">
          <section class="zone zone-exchange">
            <div class="zone-title">🔄 りょうがえ</div>
            <div id="exchangeArea" class="exchange-area">
              <span class="exchange-hint">10 や 100 をここにドロップ</span>
            </div>
          </section>
        </div>
      </div>

      <section class="zone zone-people">
        <div class="zone-title">わける</div>
        <div id="peopleZone" class="people-zone">
          <span class="placeholder">「人数」または「１人分の数」を入力すると人があらわれます</span>
        </div>
      </section>
    </div>
  </div>

  <div class="right-pane" id="rightPane">
    <section class="zone zone-hissan">
      <div class="zone-title">筆算</div>
      <div id="hissanDisplay">
        <div id="hissanBracketDisplay"></div>
      </div>
    </section>
  </div>

  <div class="step-indicator" id="stepIndicator">
    <div class="step-item" data-step="tateru">たてる</div>
    <div class="step-item" data-step="kakeru">かける</div>
    <div class="step-item" data-step="hiku">ひく</div>
    <div class="step-item" data-step="orosu">おろす</div>
  </div>
</div>

<script>
  const TRAY_COLORS = ['tray-0','tray-1','tray-2','tray-3','tray-4','tray-5'];
  const ANIMALS = ['😺','🐱','😼','🐶','🐭','🐹','🐰','🐙','🐣','🐼','🐷','🙈','🙉','🙊','🦁','🐻','🐸','🐯','🐮','🐧','🐦','🐟','🐢','🦊','🐨','🦋','🐳','🐴','🐑','🐐','🦌','🐕','🐈','🐇','🦝','🦨','🦥','🐿','🦔','🐘','🐪','🦒','🦓','🦆','🦅','🦉','🦚','🦜','🐓','🦈','🐠','🦑','🦞','🦀','🐝','🐞'];

  const state = {
    total:        null,
    people:       null,
    perPerson:    null,
    extraPeople:  1,
    leftMode:     'maru',   // 'maru' | 'kurai' | 'none'
    kuriMode:     false,    // derived: leftMode === 'kurai'
    hissanMode:   false,
    hissanStepIdx:      -1,
    hissanFrames:       [],
    hissanDistributed:  new Set(),
    items:        [],
    nextId:       0,
    nextGroupId:  0,
    groups:       new Map(),  // groupId → { color, capacity, itemValue }
    hissanPostHL: null,
    personIcons:  [],
  };

  function getPersonIcon(i) {
    if (!state.personIcons[i]) {
      if (Math.random() < 0.0001) {
        state.personIcons[i] = '🏄';       // 1/10000
      } else if (Math.random() < 0.0002) {
        state.personIcons[i] = '🐦‍🔥';    // 1/5000
      } else if (Math.random() < 0.0002) {
        state.personIcons[i] = '🐉';       // 1/5000
      } else if (Math.random() < 0.001) {
        state.personIcons[i] = '🦕';       // 1/1000
      } else if (Math.random() < 0.002) {
        state.personIcons[i] = '🦖';       // 1/500
      } else if (Math.random() < 0.01) {
        state.personIcons[i] = '🦍';       // 1/100
      } else if (Math.random() < 0.0033) {
        state.personIcons[i] = '🦄';       // 1/300
      } else if (Math.random() < 0.01) {
        state.personIcons[i] = '🐬';       // 1/100
      } else {
        const pool = ANIMALS.filter(a => !state.personIcons.includes(a));
        const src  = pool.length > 0 ? pool : ANIMALS;
        state.personIcons[i] = src[Math.floor(Math.random() * src.length)];
      }
    }
    return state.personIcons[i];
  }

  const totalInput       = document.getElementById('totalInput');
  const peopleInput      = document.getElementById('peopleInput');
  const perInput         = document.getElementById('perInput');
  const remainderDisplay = document.getElementById('remainderDisplay');
  const remainderValue   = document.getElementById('remainderValue');
  const checkBtn         = document.getElementById('checkBtn');
  const resetBtn         = document.getElementById('resetBtn');
  const maruBtn          = document.getElementById('maruBtn');
  const kuraiBtn         = document.getElementById('kuraiBtn');
  const hissanBtn        = document.getElementById('hissanBtn');
  const appLayout        = document.getElementById('appLayout');
  const leftPaneEl       = appLayout.querySelector('.left-pane');
  const feedbackEl       = document.getElementById('feedback');
  const objectsArea      = document.getElementById('objectsArea');
  const exchangeZone     = document.getElementById('exchangeZone');
  const exchangeArea     = document.getElementById('exchangeArea');
  const peopleZone       = document.getElementById('peopleZone');
  var pendingExchangeTimer = null;
  var pendingDistribTimers = [];
  var pendingPostHLTimer   = null;
  var isDistributing       = false; // 配布アニメーション中は people zone の zoom 再計算を抑制
  var autoPlayTimer        = null;
  var AUTO_PLAY_INTERVAL   = 3000; // ms per step

  function getInt(el) {
    const v = parseInt(el.value, 10);
    return (Number.isFinite(v) && v > 0) ? v : null;
  }

  function deriveMode() {
    if (state.total && state.people)    return 'equal-share';
    if (state.total && state.perPerson) return 'measurement';
    return null;
  }

  function getPeopleCount() {
    const m = deriveMode();
    if (m === 'equal-share') return state.people;
    if (m === 'measurement') return state.extraPeople;
    return 0;
  }

  function traySum(idx) {
    return state.items.filter(i => i.location === idx).reduce((a, i) => a + i.value, 0);
  }

  function poolSum() {
    return state.items.filter(i => i.location === 'pool').reduce((a, i) => a + i.value, 0);
  }

  /* ── アイテム構築 ── */
  function buildItems() {
    state.items = [];
    state.nextId = 0;
    state.nextGroupId = 0;
    state.groups.clear();
    const total = state.total || 0;
    if (!total) return;
    if (state.kuriMode) {
      const hundreds = Math.floor(total / 100);
      const tens     = Math.floor((total % 100) / 10);
      const ones     = total % 10;
      for (let i = 0; i < hundreds; i++) state.items.push({ id: state.nextId++, value: 100, location: 'pool' });
      for (let i = 0; i < tens;     i++) state.items.push({ id: state.nextId++, value: 10,  location: 'pool' });
      for (let i = 0; i < ones;     i++) state.items.push({ id: state.nextId++, value: 1,   location: 'pool' });
    } else {
      for (let i = 0; i < total; i++) state.items.push({ id: state.nextId++, value: 1, location: 'pool' });
    }
  }

  /* ── ドット要素 ── */
  function makeDotEl(item) {
    const el = document.createElement('div');
    const cls = item.value === 100 ? 'hundred'
              : item.value === 10  ? 'ten'
              : ('one' + (state.kuriMode ? ' kurai' : ''));
    var dropHL = (state.hissanPostHL && state.hissanPostHL.phase === 'drop'
                  && item.groupId === undefined && item.value === state.hissanPostHL.lowerDenom) ? ' tile-hl-drop' : '';
    el.className  = 'dot ' + cls
      + (item.awaitingExchange ? ' tile-await-exchange' : '')
      + (item.hlRemainder      ? ' tile-hl-remainder'   : '')
      + (item.hlPartial        ? ' tile-hl-partial'     : '')
      + dropHL;
    el.dataset.id = item.id;
    el.textContent = item.value === 100 ? '100'
                   : item.value === 10  ? '10'
                   : (state.kuriMode    ? '1' : '●');
    attachDrag(el, item);
    return el;
  }

  /* ── レンダリング ── */
  function renderAll() { renderObjects(); renderPeople(); renderHissan(); }

  function renderObjects() {
    objectsArea.innerHTML = '';
    const pool = state.items.filter(i => i.location === 'pool');
    if (!state.total) {
      objectsArea.innerHTML = '<span class="placeholder">「ぜんぶの数」を入力すると●があらわれます</span>';
      return;
    }
    if (pool.length === 0) {
      objectsArea.innerHTML = '<span class="placeholder" style="color:#16a34a;font-weight:800;">ぜんぶくばりおわりました！</span>';
      return;
    }

    // hlPartial タイルだけ wrapper で囲む（hlRemainder はタイル単位で CSS クラスを付ける）
    const hasHl  = pool.some(i => i.hlPartial);
    const hlWrap = hasHl ? document.createElement('div') : null;
    if (hlWrap) hlWrap.className = 'pool-hl-wrapper';

    // state.items の順序通りにインターリーブして描画（グループは最初のメンバーの位置に出現）
    const renderedGroups = new Set();
    pool.forEach(item => {
      if (item.groupId !== undefined) {
        if (renderedGroups.has(item.groupId)) return;
        renderedGroups.add(item.groupId);

        const meta      = state.groups.get(item.groupId);
        if (!meta) return;
        const poolItems = pool.filter(i => i.groupId === item.groupId);
        const wrapper   = document.createElement('div');
        var groupExchHL = (state.hissanPostHL && state.hissanPostHL.phase === 'exch'
                           && meta.itemValue === state.hissanPostHL.lowerDenom) ? ' group-hl-exch' : '';
        wrapper.className = 'exchange-group'
          + (state.animateNewGroups ? ' exchange-group-new' : '')
          + groupExchHL;
        wrapper.style.borderColor = meta.color;
        wrapper.style.background  = meta.color + '18';
        wrapper.style.display = 'grid';
        wrapper.style.gridTemplateColumns = 'repeat(5, auto)';

        poolItems.forEach(pi => wrapper.appendChild(makeDotEl(pi)));

        const emptyCls  = meta.itemValue === 10 ? 'ten' : meta.itemValue === 100 ? 'hundred' : 'one kurai';
        const emptyCount = meta.capacity - poolItems.length;
        for (let k = 0; k < emptyCount; k++) {
          const empty = document.createElement('div');
          empty.className = `dot dot-empty ${emptyCls}`;
          wrapper.appendChild(empty);
        }

        const dest = (hasHl && poolItems.some(i => i.hlPartial)) ? hlWrap : objectsArea;
        dest.appendChild(wrapper);
      } else {
        const dest = (hasHl && item.hlPartial) ? hlWrap : objectsArea;
        dest.appendChild(makeDotEl(item));
      }
    });

    if (hlWrap) objectsArea.appendChild(hlWrap);
    scaleObjectsToFit();
  }

  function renderPeople() {
    peopleZone.innerHTML = '';
    const mode = deriveMode();
    if (!mode) {
      peopleZone.innerHTML = '<span class="placeholder">「人数」または「１人分の数」を入力すると人があらわれます</span>';
      return;
    }

    if (mode === 'measurement') {
      const adj = document.createElement('div');
      adj.className = 'people-adjuster';
      const minus = document.createElement('button');
      minus.className = 'adj-btn';
      minus.textContent = '－';
      minus.onclick = () => {
        if (state.extraPeople <= 1) return;
        const last = state.extraPeople - 1;
        state.items.forEach(i => { if (i.location === last) i.location = 'pool'; });
        state.extraPeople--;
        hideFeedback();
        renderAll();
      };
      const lbl = document.createElement('span');
      lbl.textContent = `${state.extraPeople}人`;
      const plus = document.createElement('button');
      plus.className = 'adj-btn';
      plus.textContent = '＋';
      plus.onclick = () => { state.extraPeople++; hideFeedback(); renderAll(); };
      adj.append(minus, lbl, plus);
      peopleZone.appendChild(adj);
    }

    const count = getPeopleCount();
    for (let i = 0; i < count; i++) {
      const slot = document.createElement('div');
      slot.className = 'person-slot';

      const icon = document.createElement('div');
      icon.className = 'person-icon';
      icon.textContent = getPersonIcon(i);

      const name = document.createElement('div');
      name.className = 'person-name';
      name.textContent = `${i + 1}人め`;

      const tray = document.createElement('div');
      const trayItems = state.items.filter(it => it.location === i);
      const tileCount = trayItems.length;
      const sizeClass = tileCount >= 14 ? ' tray-xxs' : tileCount >= 9 ? ' tray-xs' : tileCount >= 5 ? ' tray-sm' : '';
      tray.className = 'person-tray ' + TRAY_COLORS[i % TRAY_COLORS.length] + sizeClass;
      tray.dataset.tray = i;
      trayItems.forEach(it => tray.appendChild(makeDotEl(it)));

      const sum = traySum(i);
      const countLbl = document.createElement('div');
      countLbl.className = 'tray-count';
      countLbl.textContent = sum > 0 ? `${sum}こ` : '';

      slot.append(icon, name, tray, countLbl);
      peopleZone.appendChild(slot);
    }
    // アニメーション中以外は毎回 zoom を再計算（tightenZoom で縮小されたままになるのを防ぐ）
    if (!isDistributing) scalePeopleToFit();
  }

  /* ── ドラッグ & ドロップ ── */
  function attachDrag(el, item) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      const rect = el.getBoundingClientRect();
      const offX = e.clientX - rect.left;
      const offY = e.clientY - rect.top;

      const ghost = el.cloneNode(true);
      ghost.className = el.className + ' ghost';
      ghost.style.cssText += `left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;`;
      document.body.appendChild(ghost);

      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);

      function onMove(ev) {
        ghost.style.left = (ev.clientX - offX) + 'px';
        ghost.style.top  = (ev.clientY - offY) + 'px';
        ghost.style.pointerEvents = 'none';
        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        ghost.style.pointerEvents = '';
        document.querySelectorAll('.person-tray,.objects-area,.exchange-area').forEach(t => t.classList.remove('drag-over'));
        const tray     = under?.closest('.person-tray');
        const pool     = under?.closest('.objects-area');
        const exchange = under?.closest('.exchange-area');
        if (tray)          tray.classList.add('drag-over');
        else if (exchange && item.value > 1) exchange.classList.add('drag-over');
        else if (pool)     pool.classList.add('drag-over');
      }

      function onEnd(ev) {
        ghost.style.pointerEvents = 'none';
        const under    = document.elementFromPoint(ev.clientX, ev.clientY);
        const tray     = under?.closest('.person-tray');
        const pool     = under?.closest('.objects-area');
        const exchange = under?.closest('.exchange-area');

        if (exchange && item.value > 1) {
          exchangeItem(item);
        } else if (tray) {
          item.location = parseInt(tray.dataset.tray, 10);
        } else if (pool) {
          item.location = 'pool';
        }

        ghost.remove();
        el.classList.remove('dragging');
        document.querySelectorAll('.person-tray,.objects-area,.exchange-area').forEach(t => t.classList.remove('drag-over'));
        el.removeEventListener('pointermove',  onMove);
        el.removeEventListener('pointerup',    onEnd);
        el.removeEventListener('pointercancel', onEnd);
        hideFeedback();
        renderAll();
      }

      el.addEventListener('pointermove',  onMove);
      el.addEventListener('pointerup',    onEnd);
      el.addEventListener('pointercancel', onEnd);
    });
    scalePeopleToFit();
  }

  /* ── 入力イベント ── */
  function onInput() {
    state.total     = getInt(totalInput);
    state.people    = getInt(peopleInput);
    state.perPerson = getInt(perInput);
    state.hissanStepIdx = -1; state.hissanFrames = []; state.hissanDistributed.clear();
    buildItems();
    checkBtn.disabled = !deriveMode();
    hideFeedback();
    renderAll();
  }

  [totalInput, peopleInput, perInput].forEach(el => el.addEventListener('input', onInput));

  /* ── りょうがえ ── */
  function exchangeItem(item) {
    // state から最新のアイテムを参照し直す（再描画後の古い参照対策）
    const src = state.items.find(i => i.id === item.id);
    if (!src || src.value <= 1) return;

    const idx        = state.items.indexOf(src);
    const newValue   = src.value / 10;
    const groupColor = src.value === 100 ? '#7c3aed' : '#f59e0b';
    const groupId    = state.nextGroupId++;

    state.groups.set(groupId, { color: groupColor, capacity: 10, itemValue: newValue });
    const newTiles = [];
    for (let j = 0; j < 10; j++) {
      newTiles.push({ id: state.nextId++, value: newValue, location: 'pool', groupId, groupColor });
    }
    // 元のタイルの位置に差し込む（並び順を維持）
    state.items.splice(idx, 1, ...newTiles);
  }

  /* ── モード制御 ── */
  var _leftPaneTransEndHandler = null;
  function applyModeState() {
    var leftVisible = state.leftMode !== 'none';
    var wasOff = appLayout.classList.contains('left-pane-off');
    state.kuriMode  = (state.leftMode === 'kurai');

    appLayout.classList.toggle('hissan-active',  state.hissanMode);
    appLayout.classList.toggle('left-pane-off',  !leftVisible);
    document.getElementById('pageWrap').classList.toggle('hissan-active', state.hissanMode);
    exchangeZone.classList.toggle('visible', state.kuriMode || state.hissanMode);

    maruBtn.classList.toggle('on',   state.leftMode === 'maru');
    kuraiBtn.classList.toggle('on',  state.leftMode === 'kurai');
    hissanBtn.classList.toggle('on', state.hissanMode);

    // 左ペイン非表示→表示の遷移後に zoom を再計算（transition 中に測定すると小さくなる）
    if (_leftPaneTransEndHandler) {
      leftPaneEl.removeEventListener('transitionend', _leftPaneTransEndHandler);
      _leftPaneTransEndHandler = null;
    }
    if (wasOff && leftVisible) {
      _leftPaneTransEndHandler = function(e) {
        if (e.propertyName !== 'flex-basis') return;
        leftPaneEl.removeEventListener('transitionend', _leftPaneTransEndHandler);
        _leftPaneTransEndHandler = null;
        scaleObjectsToFit();
        scalePeopleToFit();
      };
      leftPaneEl.addEventListener('transitionend', _leftPaneTransEndHandler);
    }
  }

  maruBtn.addEventListener('click', () => {
    if (state.leftMode === 'maru') {
      if (state.hissanMode) state.leftMode = 'none';
    } else {
      var prevMode = state.leftMode;
      state.leftMode  = 'maru';
      state.kuriMode  = false; // buildItems() の前に同期
      if (prevMode === 'kurai') buildItems();
    }
    hideFeedback();
    applyModeState();
    renderAll();
  });

  kuraiBtn.addEventListener('click', () => {
    if (state.leftMode === 'kurai') {
      if (state.hissanMode) state.leftMode = 'none';
    } else {
      state.leftMode = 'kurai';
      state.kuriMode = true; // buildItems() の前に同期
      // hissan 進行中はフレーム状態を復元（全タイルを pool に戻さない）
      if (state.hissanMode && state.hissanStepIdx >= 0
          && state.hissanFrames && state.hissanFrames.length > 0) {
        var _div = state.total, _dvs = hissanDivisorFromState();
        if (_div && _dvs) {
          var _ds    = computeDivisionSteps(_div, _dvs);
          var _frame = state.hissanFrames[state.hissanStepIdx];
          syncLeftPaneToFrame(_frame, _ds, _dvs);
          applyHlRemainder(_frame, _ds);
          applyHlPartial(_frame, _ds);
        } else {
          buildItems();
        }
      } else {
        buildItems();
      }
    }
    hideFeedback();
    applyModeState();
    renderAll();
  });

  hissanBtn.addEventListener('click', () => {
    if (state.hissanMode) {
      if (state.leftMode !== 'none') { stopAutoPlay(); state.hissanMode = false; }
    } else {
      state.hissanMode = true;
      if (state.leftMode === 'maru') {
        state.leftMode = 'kurai';
        state.kuriMode = true; // buildItems() の前に同期
        buildItems();
      }
    }
    hideFeedback();
    applyModeState();
    renderAll();
  });

  function hissanDivisorFromState() {
    var mode = deriveMode();
    if (mode === 'equal-share') return state.people;
    if (mode === 'measurement') return state.perPerson;
    return state.people || state.perPerson || null;
  }

  function hissanDivisorLabel() {
    var mode = deriveMode();
    if (mode === 'equal-share') return '人数';
    if (mode === 'measurement') return '1人分の数';
    return state.perPerson ? '1人分の数' : '人数';
  }

  function renderHissan() {
    if (!state.hissanMode) return;
    renderHissanBracket();
  }

  function updateStepIndicator(stepType) {
    document.querySelectorAll('.step-item').forEach(function(el) {
      el.classList.toggle('active', el.dataset.step === stepType);
    });
  }

  function scaleHissanToFit() {
    var hissanDisplay = document.getElementById('hissanDisplay');
    var bd = document.getElementById('hissanBracketDisplay');
    if (!hissanDisplay || !bd) return;
    bd.style.zoom = '1';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var availW = hissanDisplay.clientWidth - 24;
        var availH = hissanDisplay.clientHeight - 24;
        var natW   = bd.offsetWidth;
        var natH   = bd.offsetHeight;
        if (availW > 0 && availH > 0 && natW > 0 && natH > 0) {
          var sW = natW > availW ? availW / natW : 1;
          var sH = natH > availH ? availH / natH : 1;
          var s  = Math.min(sW, sH);
          bd.style.zoom = s < 1 ? String(Math.max(0.3, s)) : '';
        } else {
          bd.style.zoom = '';
        }
      });
    });
  }

  function scaleLeftPaneToFit() {
    scaleObjectsToFit();
    scalePeopleToFit();
  }

  function scaleZoneContent(el) {
    if (!el) return;
    el.style.zoom = '1';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var availW = el.clientWidth;
        var availH = el.clientHeight;
        if (availW <= 0 || availH <= 0) { el.style.zoom = ''; return; }
        var natW = el.scrollWidth;
        var natH = el.scrollHeight;
        if (natW <= availW && natH <= availH) { el.style.zoom = ''; return; }

        // パス1: 線形式（保守的・オーバーフロー回避保証）— 96% マージンでクロップ防止
        var sLo = Math.max(0.25, Math.min(
          natW > availW ? (availW * 0.96) / natW : 1,
          natH > availH ? (availH * 0.96) / natH : 1
        ));

        // 面積比の sqrt 式（多数の小要素で flex-wrap が詰まる場合により最適）— 92% マージン
        var sSqrt = Math.min(1, Math.sqrt((availW * availH * 0.92) / (natW * natH)));
        sSqrt = Math.max(0.25, sSqrt);

        if (sSqrt <= sLo * 1.05) {
          el.style.zoom = String(sLo);
        } else {
          el.style.zoom = String(sSqrt);
        }

        // パス3以降: 縦余白を使って段階的に拡大（最大 2 ラウンド）
        // flex-wrap コンテナは拡大しても横方向へ折り返しで吸収できるため、
        // 縦余白だけを基準に試算し、オーバーフロー検証で安全性を担保する。
        function upscaleRound(fallbackZoom, round) {
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              var cur = parseFloat(el.style.zoom) || 1;
              var h   = el.scrollHeight, w = el.scrollWidth;

              // 直前パスがオーバーフロー（97% 超で判定） → fallback に戻して終了
              if (h > availH * 0.97 || w > availW * 0.97) {
                el.style.zoom = String(fallbackZoom);
                return;
              }

              // 縦余白 < 15% ならこのラウンドは不要
              if (h >= availH * 0.85 || h <= 0) return;

              // 目標を 95% に抑えてクロップ防止マージンを確保
              var ratio     = (availH * 0.95) / h;
              // 積極的な推定: sqrt(ratio) — flex-wrap 折り返しでの行数増加を想定
              var tryZoom   = Math.min(1, cur * Math.sqrt(ratio));
              // 保守的な推定: 4乗根 — tryZoom がオーバーフローしたときの fallback
              var safeZoom  = Math.min(1, cur * Math.pow(ratio, 0.25));

              if (tryZoom <= cur * 1.02) return; // 改善量が 2% 未満なら打ち切り

              el.style.zoom = String(tryZoom);

              // 検証: tryZoom がオーバーフローなら safeZoom を試す（97% で判定してマージン確保）
              requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                  if (el.scrollHeight > availH * 0.97 || el.scrollWidth > availW * 0.97) {
                    // tryZoom はオーバーフロー
                    if (safeZoom > cur * 1.02) {
                      el.style.zoom = String(safeZoom);
                      // safeZoom の検証（97% 超過なら cur に戻す）
                      requestAnimationFrame(function() {
                        requestAnimationFrame(function() {
                          if (el.scrollHeight > availH * 0.97 || el.scrollWidth > availW * 0.97) {
                            el.style.zoom = String(cur);
                          }
                          // safeZoom で収まった場合は次ラウンドへ進まない（保守的に止める）
                        });
                      });
                    } else {
                      el.style.zoom = String(cur);
                    }
                  } else if (round < 2) {
                    // tryZoom が収まった → 次ラウンドでさらに余白を詰める
                    upscaleRound(cur, round + 1);
                  }
                });
              });
            });
          });
        }
        upscaleRound(sLo, 1);
      });
    });
  }

  // アニメーション中に要素が追加されたとき用：縮小のみ行う軽量版
  function tightenZoom(el) {
    if (!el) return;
    requestAnimationFrame(function() {
      var h = el.scrollHeight, w = el.scrollWidth;
      var aH = el.clientHeight, aW = el.clientWidth;
      if (h > aH || w > aW) {
        var cur = parseFloat(el.style.zoom) || 1;
        var s = Math.max(0.25, Math.min(
          w > aW ? aW / w * cur : cur,
          h > aH ? aH / h * cur : cur
        ));
        if (s < cur) el.style.zoom = String(s);
      }
    });
  }

  function scaleObjectsToFit() {
    scaleZoneContent(document.getElementById('objectsArea'));
  }

  function scalePeopleToFit() {
    scaleZoneContent(document.getElementById('peopleZone'));
  }

  function renderHissanBracket() {
    var bd = document.getElementById('hissanBracketDisplay');
    if (!bd) return;
    var dividend = state.total;
    var divisor  = hissanDivisorFromState();
    if (state.hissanStepIdx < 0) {
      bd.innerHTML = buildHissanEditable(dividend, divisor) + buildStepCtrl(true, -1, 0);
      var divIn   = bd.querySelector('#hissanDividendInput');
      var divsrIn = bd.querySelector('#hissanDivisorInput');
      if (divIn)   divIn.addEventListener('input', onHissanDividendInput);
      if (divsrIn) divsrIn.addEventListener('input', onHissanDivisorInput);
      updateStepIndicator('');
    } else {
      if (!state.hissanFrames.length)
        state.hissanFrames = computeHissanFrames(dividend, divisor);
      var frame = state.hissanFrames[state.hissanStepIdx];
      bd.innerHTML = buildMsgBubble(frame)
        + buildHissanStepped(frame, dividend, divisor)
        + buildStepCtrl(true, state.hissanStepIdx, state.hissanFrames.length);
      updateStepIndicator(frame.stepType || '');
    }
    var nb  = bd.querySelector('#hissanNextBtn');
    var pb  = bd.querySelector('#hissanPrevBtn');
    var rb  = bd.querySelector('#hissanStepResetBtn');
    var sb  = bd.querySelector('#hissanStartBtn');
    var ab  = bd.querySelector('#hissanAutoBtn');
    var spd = bd.querySelector('#speedSlider');
    if (nb)  nb.addEventListener('click', onHissanNext);
    if (pb)  pb.addEventListener('click', onHissanPrev);
    if (rb)  rb.addEventListener('click', function() { stopAutoPlay(); onHissanReset(); });
    if (sb)  sb.addEventListener('click', onHissanStart);
    if (ab)  ab.addEventListener('click', toggleAutoPlay);
    if (spd) spd.addEventListener('input', function() {
      AUTO_PLAY_INTERVAL = (6 - parseFloat(this.value)) * 1000;
    });
    scaleHissanToFit();
  }

  function onHissanNext() {
    if (state.hissanStepIdx < state.hissanFrames.length - 1) {
      if (!autoPlayTimer) stopAutoPlay(); // 手動操作で自動再生停止
      state.hissanStepIdx++;
      renderHissanBracket();
      syncLeftPane();
    }
  }
  function onHissanPrev() {
    if (state.hissanStepIdx > 0) {
      stopAutoPlay();
      state.hissanStepIdx--;
      var dividend = state.total, divisor = hissanDivisorFromState();
      if (!dividend || !divisor) { renderHissanBracket(); return; }
      var ds    = computeDivisionSteps(dividend, divisor);
      var frame = state.hissanFrames[state.hissanStepIdx];
      // hissanDistributed をこのフレームの lShow に合わせて再構築
      state.hissanDistributed.clear();
      ds.steps.forEach(function(step, i) {
        if (frame.lShow[i]) state.hissanDistributed.add(i);
      });
      renderHissanBracket();
      syncLeftPaneToFrame(frame, ds, divisor);
      applyHlRemainder(frame, ds);
      applyHlPartial(frame, ds);
      renderObjects();
      renderPeople();
    }
  }
  function onHissanReset() {
    stopAutoPlay();
    state.hissanStepIdx = -1; state.hissanFrames = []; state.hissanDistributed.clear();
    renderHissanBracket();
    buildItems(); renderObjects(); renderPeople();
  }
  function onHissanStart() {
    var dividend = state.total, divisor = hissanDivisorFromState();
    if (!dividend || !divisor) return;
    state.hissanFrames  = computeHissanFrames(dividend, divisor);
    state.hissanStepIdx = 0;
    buildItems();
    renderHissanBracket();
    syncLeftPane();
  }

  function stopAutoPlay() {
    if (autoPlayTimer) { clearTimeout(autoPlayTimer); autoPlayTimer = null; }
    var btn = document.getElementById('hissanAutoBtn');
    if (btn) { btn.textContent = '▶'; btn.title = '自動再生'; }
  }

  function scheduleAutoStep() {
    autoPlayTimer = setTimeout(doAutoStep, AUTO_PLAY_INTERVAL);
  }

  function doAutoStep() {
    autoPlayTimer = null;
    if (!state.hissanMode) { stopAutoPlay(); return; }
    if (!state.hissanFrames.length) {
      // まだ開始していない → 開始
      onHissanStart();
    } else if (state.hissanStepIdx >= state.hissanFrames.length - 1) {
      // 最後 → 先頭に戻ってループ
      state.hissanStepIdx = 0;
      state.hissanDistributed.clear();
      var _div = state.total, _dvs = hissanDivisorFromState();
      var _ds  = computeDivisionSteps(_div, _dvs);
      var _f   = state.hissanFrames[0];
      renderHissanBracket();
      syncLeftPaneToFrame(_f, _ds, _dvs);
      renderObjects();
      renderPeople();
    } else {
      onHissanNext();
    }
    var btn = document.getElementById('hissanAutoBtn');
    if (btn) { btn.textContent = '⏸'; btn.title = '停止'; }
    scheduleAutoStep();
  }

  function toggleAutoPlay() {
    if (autoPlayTimer) {
      stopAutoPlay();
    } else {
      var btn = document.getElementById('hissanAutoBtn');
      if (btn) { btn.textContent = '⏸'; btn.title = '停止'; }
      doAutoStep();
    }
  }

  function computeHissanFrames(dividend, divisor) {
    var ds = computeDivisionSteps(dividend, divisor);
    var digits = ds.digits, n = ds.n, steps = ds.steps, ns = steps.length;

    function empty() {
      return { msg:'', msgType:'normal', stepType:'', bdStep:-1, preExch:0, hlRem:-1, hlQ:-1, hlMulStep:-1, dropArrow:-1, dropArrowStep:-1, hlPartialStep:-1,
        qShow: new Array(n).fill(false), hlDiv: [],
        pShow: new Array(ns).fill(false), lShow: new Array(ns).fill(false),
        rShow: new Array(ns).fill(false), ptShow: new Array(ns).fill(false) };
    }
    function clone(f) {
      return { msg:f.msg, msgType:f.msgType, stepType:f.stepType, bdStep:f.bdStep, preExch:f.preExch, hlRem:-1, hlQ:-1, hlMulStep:-1, dropArrow:-1, dropArrowStep:-1, hlPartialStep:-1,
        qShow:f.qShow.slice(), hlDiv:f.hlDiv.slice(),
        pShow:f.pShow.slice(), lShow:f.lShow.slice(),
        rShow:f.rShow.slice(), ptShow:f.ptShow.slice() };
    }

    var frames = [], cur = empty();
    cur.msg = '「→」を押して筆算を進めよう！'; frames.push(clone(cur));

    steps.forEach(function(step, i) {
      cur = clone(frames[frames.length - 1]); cur.bdStep = -1;

      if (i === 0) {
        if (step.col > 0) {
          for (var dc = 0; dc < step.col; dc++) {
            var fa = clone(cur); fa.hlDiv = [dc]; fa.preExch = dc; fa.stepType = 'tateru';
            fa.msg = digits[dc] + ' は ' + divisor + ' よりちいさいね。つぎの位もいっしょに見よう。';
            fa.msgType = 'question'; frames.push(fa); cur = clone(fa);
          }
          var hlR = []; for (var c = 0; c <= step.col; c++) hlR.push(c);
          var fb = clone(cur); fb.hlDiv = hlR; fb.preExch = step.col; fb.stepType = 'tateru';
          fb.msg = String(step.partial) + ' ÷ ' + divisor + '　われるかな？';
          fb.msgType = 'question'; frames.push(fb); cur = clone(fb);
        } else {
          var fc = clone(cur); fc.hlDiv = [0]; fc.stepType = 'tateru';
          fc.msg = digits[0] + ' ÷ ' + divisor + '　われるかな？';
          fc.msgType = 'question'; frames.push(fc); cur = clone(fc);
        }
      } else {
        var fd = clone(cur); fd.ptShow[i] = true; fd.bdStep = i - 1; fd.hlPartialStep = i; fd.stepType = 'tateru';
        fd.msg = String(step.partial) + ' ÷ ' + divisor + ' をしよう！'; fd.msgType = 'question';
        frames.push(fd); cur = clone(fd);
      }

      var fq = clone(cur); fq.qShow[step.col] = true; fq.hlDiv = []; fq.hlQ = step.col; fq.stepType = 'tateru'; fq.bdStep = -1;
      var qHL = '<span style="color:#16a34a;background:rgba(22,163,74,0.18);padding:1px 5px;border-radius:5px;font-size:1.05em;">' + step.q + '</span>';
      fq.msg = String(step.partial) + ' ÷ ' + divisor + ' = ' + qHL
        + (step.remainder > 0 ? ' あまり ' + step.remainder : '')
        + '　→　「' + qHL + '」を上に書こう！';
      fq.msgType = 'correct'; frames.push(fq); cur = clone(fq);

      var fp = clone(cur); fp.pShow[i] = true; fp.hlMulStep = i; fp.stepType = 'kakeru';
      var mS = function(t) { return '<span style="color:#1f2933;background:rgba(124,58,237,0.18);padding:1px 5px;border-radius:5px;">' + t + '</span>'; };
      var pS = function(t) { return '<span style="color:#1f2933;background:rgba(234,88,12,0.18);padding:1px 5px;border-radius:5px;">' + t + '</span>'; };
      fp.msg = mS(step.q + ' × ' + divisor) + ' = ' + pS(step.product) + '　→　下に書こう。';
      fp.msgType = 'normal'; frames.push(fp); cur = clone(fp);

      var isLast = (i === steps.length - 1);
      if (isLast) {
        var fl = clone(cur); fl.lShow[i] = true; fl.rShow[i] = true; fl.stepType = 'hiku';
        fl.msg = step.partial + ' − ' + step.product + ' = ' + step.remainder
          + (step.remainder > 0 ? '　あまり ' + step.remainder + '！' : '　ぴったり！');
        fl.msgType = 'correct';
        frames.push(fl); cur = clone(fl);
      } else {
        var fl1 = clone(cur); fl1.lShow[i] = true; fl1.rShow[i] = true; fl1.hlRem = i; fl1.stepType = 'hiku';
        fl1.msg = step.partial + ' − ' + step.product + ' = ' + step.remainder;
        fl1.msgType = 'correct';
        frames.push(fl1); cur = clone(fl1);
        var fl2 = clone(cur); fl2.dropArrow = steps[i + 1].col; fl2.dropArrowStep = i;
        fl2.ptShow[i + 1] = true; fl2.stepType = 'orosu';
        fl2.msg = 'つぎの位をおろそう。'; fl2.msgType = 'normal';
        frames.push(fl2); cur = clone(fl2);
      }
    });

    var qq = Math.floor(dividend / divisor), rr = dividend % divisor;
    var done = clone(cur); done.hlDiv = [];
    done.msg = 'こたえ：' + dividend + ' ÷ ' + divisor + ' = ' + (rr > 0 ? qq + ' あまり ' + rr : qq);
    done.msgType = 'complete'; frames.push(done);
    return frames;
  }

  function buildHissanStepped(frame, dividend, divisor) {
    var ds = computeDivisionSteps(dividend, divisor);
    var digits = ds.digits, n = ds.n, steps = ds.steps;
    var C = 68, BL = 28, LEAD = C + BL;
    var divisorFontSize = String(divisor).length >= 3 ? 28 : String(divisor).length >= 2 ? 34 : 44;
    var hlSet = {}; frame.hlDiv.forEach(function(c) { hlSet[c] = true; });

    var PLACE_NAMES = ['一', '十', '百', '千', '万'];
    function colBorder(col) {
      return col < n - 1 ? 'border-right:1px dashed rgba(148,163,184,0.4);' : '';
    }
    function cell(ch, color, size, hl, vis, pulse, extraClass, col) {
      size = size || 40;
      var bg  = hl ? 'rgba(251,191,36,0.55)' : 'transparent';
      var v   = vis === false ? 'hidden' : 'visible';
      var clsArr = [];
      if (pulse)      clsArr.push('hissan-rem-hl');
      if (extraClass) clsArr.push(extraClass);
      var cls = clsArr.length ? ' class="' + clsArr.join(' ') + '"' : '';
      return '<div' + cls + ' style="width:' + C + 'px;text-align:center;font-size:' + size + 'px;'
        + 'font-weight:800;color:' + color + ';visibility:' + v + ';background:' + bg + ';border-radius:6px;transition:background .2s;' + colBorder(col !== undefined ? col : n) + '">'
        + (ch !== null ? ch : '0') + '</div>';
    }
    function placeRow(num, rightCol, color, vis, hlRow, extraCellClass) {
      var s = String(num), lc = Math.max(0, rightCol - s.length + 1);
      var cells = new Array(n).fill(null);
      s.split('').forEach(function(ch, i) { if (lc + i < n) cells[lc + i] = ch; });
      return cells.map(function(ch, col) {
        var isHl = !!hlRow && ch !== null;
        var ec   = (extraCellClass && ch !== null) ? extraCellClass : '';
        return cell(ch, color, 40, isHl, vis && ch !== null, isHl, ec, col);
      }).join('');
    }
    function hline(vis) {
      return '<div style="border-top:2.5px solid #94a3b8;width:' + (n * C) + 'px;margin:2px 0;visibility:' + (vis ? 'visible' : 'hidden') + ';"></div>';
    }

    var qArr = new Array(n).fill(null);
    steps.forEach(function(s) { qArr[s.col] = s.q; });
    var labelRowHTML = new Array(n).fill(null).map(function(_, col) {
      var lbl = PLACE_NAMES[n - 1 - col] || '';
      return '<div style="width:' + C + 'px;text-align:center;font-size:15px;font-weight:700;color:#94a3b8;' + colBorder(col) + '">' + lbl + '</div>';
    }).join('');
    var mulStep = frame.hlMulStep >= 0 ? steps[frame.hlMulStep] : null;
    var qRowHTML = qArr.map(function(q, col) {
      var isHlQ   = frame.hlQ === col && q !== null && frame.qShow[col];
      var isMulQ  = mulStep && col === mulStep.col && q !== null && frame.qShow[col];
      var extraCls = isMulQ ? 'hl-mul' : '';
      return cell(q !== null ? String(q) : '0', '#16a34a', 40, isHlQ, q !== null && frame.qShow[col], false, extraCls, col);
    }).join('');
    var divRowHTML = digits.map(function(d, col) {
      var isDrop = (frame.dropArrow >= 0 && col === frame.dropArrow);
      if (isDrop) {
        var arrowOverlay =
          '<div class="drop-arrow-overlay">'
          + '<div style="width:3px;height:' + (45 + frame.dropArrowStep * 113) + 'px;background:#f97316;"></div>'
          + '<div style="width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #f97316;"></div>'
          + '</div>';
        return '<div class="hissan-drop-digit" style="position:relative;width:' + C + 'px;text-align:center;'
          + 'font-size:44px;font-weight:800;color:#ef4444;background:rgba(251,191,36,0.45);'
          + 'border-radius:6px;overflow:visible;' + colBorder(col) + '">' + String(d) + arrowOverlay + '</div>';
      }
      return cell(String(d), '#ef4444', 44, !!hlSet[col], true, false, '', col);
    }).join('');

    var stHTML = '';
    steps.forEach(function(step, i) {
      if (i > 0) {
        var prevCol = steps[i - 1].col;
        var len = step.col - prevCol + 1;
        var pStr = String(step.partial).padStart(len, '0');
        var pcells = new Array(n).fill(null);
        pStr.split('').forEach(function(ch, k) { pcells[prevCol + k] = ch; });
        var isBd = frame.bdStep === i - 1;
        // fl2（つぎの位をおろそう）: dropArrow 列がこのステップの落とし先
        var isDropFrame = frame.dropArrow >= 0 && frame.bdStep < 0 && frame.dropArrow === step.col;
        // fd（XX÷divisor をしよう）: 全体を黄色ハイライト
        var isPartialHL = frame.hlPartialStep === i;
        stHTML += '<div style="display:flex;">'
          + pcells.map(function(ch, col) {
              var isNew     = isBd && col === step.col;
              var isDropNew = isDropFrame && col === step.col;
              var hlBg      = (isNew || isPartialHL) && ch !== null;
              var textColor = (isNew || isDropNew) ? '#f97316' : '#1f2933';
              return cell(ch, textColor, 40, hlBg, frame.ptShow[i] && ch !== null, false, '', col);
            }).join('') + '</div>';
      }
      var prodHlCls = (frame.hlMulStep === i) ? 'hl-prod' : '';
      stHTML += '<div style="display:flex;">' + placeRow(step.product, step.col, '#1f2933', frame.pShow[i], false, prodHlCls) + '</div>';
      stHTML += hline(frame.lShow[i]);
      if (frame.rShow[i]) {
        // ptShow[i+1] が true のとき、部分行が余り＋下ろし数字を一緒に表示するため余り行は非表示
        var nextPtShow = (i + 1 < steps.length) && frame.ptShow[i + 1];
        if (!nextPtShow) {
          var rc      = step.remainder > 0 ? '#f97316' : '#94a3b8';
          var hlRem   = (frame.hlRem === i);
          var exchCls = (state.hissanPostHL && state.hissanPostHL.phase === 'exch'
                         && state.hissanPostHL.bdIdx === i) ? 'hissan-exch-hl' : '';
          stHTML += '<div style="display:flex;">' + placeRow(step.remainder, step.col, rc, true, hlRem, exchCls) + '</div>';
        }
      }
    });

    return '<div style="padding:16px 20px;display:inline-flex;flex-direction:column;font-family:monospace;">'
      + '<div style="display:flex;margin-left:' + LEAD + 'px;">' + labelRowHTML + '</div>'
      + '<div style="display:flex;margin-left:' + LEAD + 'px;">' + qRowHTML + '</div>'
      + '<div style="display:flex;align-items:stretch;overflow:visible;">'
      + '<div style="width:' + C + 'px;font-size:' + divisorFontSize + 'px;font-weight:800;color:#1f2933;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;' + (mulStep ? 'background:rgba(124,58,237,0.22);border-radius:6px;' : '') + '">' + divisor + '</div>'
      + '<div style="border-top:4px solid #1f2933;padding:4px 4px 0 ' + BL + 'px;display:flex;overflow:visible;position:relative;">'
      + '<svg style="position:absolute;left:0;top:0;width:' + BL + 'px;height:100%;" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M 0,0 C 20,0 20,100 0,100" stroke="#1f2933" stroke-width="4" fill="none" vector-effect="non-scaling-stroke"/></svg>'
      + divRowHTML + '</div>'
      + '</div>'
      + '<div style="margin-left:' + LEAD + 'px;display:flex;flex-direction:column;">' + stHTML + '</div>'
      + '</div>';
  }

  function buildMsgBubble(frame) {
    var col = { question:{bg:'#fef9c3',bd:'#fde047'}, correct:{bg:'#dcfce7',bd:'#86efac'},
                complete:{bg:'#dbeafe',bd:'#93c5fd'}, normal:{bg:'#f1f5f9',bd:'#e2e8f0'} };
    var c = col[frame.msgType] || col.normal;
    return '<div style="margin:0 0 10px;padding:12px 16px;background:' + c.bg + ';border:2px solid ' + c.bd
      + ';border-radius:12px;font-size:clamp(15px,2.2vw,26px);font-weight:700;color:#1f2933;line-height:1.4;word-break:break-word;">'
      + frame.msg + '</div>';
  }

  function buildStepCtrl(canStart, stepIdx, total) {
    if (!canStart) return '';
    var pb  = 'padding:8px 20px;font-size:18px;font-weight:900;border:none;border-radius:10px;cursor:pointer;line-height:1;';
    var sb  = 'padding:8px 12px;font-size:16px;font-weight:700;border:2px solid #d1d5db;border-radius:10px;background:#fff;color:#888;cursor:pointer;line-height:1;';
    var isPlaying  = !!autoPlayTimer;
    var autoIcon   = isPlaying ? '⏸' : '▶';
    var autoTitle  = isPlaying ? '停止' : '自動再生';
    var sliderVal  = 6 - AUTO_PLAY_INTERVAL / 1000; // 左=遅(1)、右=速(5)
    var speedBar   = '<span style="font-size:11px;color:#94a3b8;">遅</span>'
      + '<input id="speedSlider" type="range" min="1" max="5" step="0.5" value="' + sliderVal + '"'
      + ' style="width:60px;accent-color:#0ea5e9;cursor:pointer;vertical-align:middle;">'
      + '<span style="font-size:11px;color:#94a3b8;">速</span>';

        + '<button id="hissanStartBtn" style="' + pb + 'background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff;">→</button>'
        + autoBtn + speedBar + '</div>';

    return '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">'
      + '<button id="hissanPrevBtn" style="' + pb + 'background:' + (isFirst ? '#e5e7eb' : 'linear-gradient(135deg,#38bdf8,#0ea5e9)') + ';color:' + (isFirst ? '#aaa' : '#fff') + ';" ' + (isFirst ? 'disabled' : '') + '>←</button>'
      + (isLast ? '' : '<button id="hissanNextBtn" style="' + pb + 'background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff;">→</button>')
      + autoBtn + speedBar
      + '<button id="hissanStepResetBtn" style="' + sb + '">↩</button>'
      + '<span style="font-size:12px;color:#94a3b8;">' + (stepIdx + 1) + ' / ' + total + '</span>'
      + '</div>';
  }

  function onHissanDividendInput() {
    state.hissanStepIdx = -1; state.hissanFrames = []; state.hissanDistributed.clear();
    var v = parseInt(this.value, 10);
    state.total = (Number.isFinite(v) && v > 0) ? v : null;
    totalInput.value = state.total != null ? state.total : '';
    buildItems();
    hideFeedback();
    checkBtn.disabled = !deriveMode();
    renderObjects();
    renderPeople();
    renderHissanBracket();

  function onHissanDivisorInput() {

    var v = parseInt(this.value, 10);

      perInput.value = val != null ? val : '';
    } else {

  function buildHissanEditable(dividend, divisor) {
    var C   = 68, BL = 28;
    var dvd = dividend != null ? String(dividend) : '';
    var dvs = divisor  != null ? String(divisor)  : '';
    var base = 'border:none;background:transparent;outline:none;font-family:monospace;font-weight:800;text-align:center;';
    return '<div style="padding:16px 20px;display:inline-flex;flex-direction:column;font-family:monospace;">'
      + '<div style="display:flex;align-items:stretch;">'
      + '<input id="hissanDivisorInput" type="number" min="1" max="99" value="' + dvs + '" placeholder="？" '
      + 'style="' + base + 'width:' + C + 'px;font-size:44px;color:#1f2933;'
      + 'padding-bottom:4px;align-self:flex-end;">'
      + '<div style="border-top:4px solid #1f2933;padding:4px 4px 0 ' + BL + 'px;position:relative;">'
      + '<svg style="position:absolute;left:0;top:0;width:' + BL + 'px;height:100%;" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M 0,0 C 20,0 20,100 0,100" stroke="#1f2933" stroke-width="4" fill="none" vector-effect="non-scaling-stroke"/></svg>'
      + '<input id="hissanDividendInput" type="number" min="1" max="9999" value="' + dvd + '" placeholder="？？？" '

  function buildHissanInputsBarHTML(dividend, divisor, divisorLabel) {
    var dv  = dividend != null ? dividend : '';
    var dvs = divisor  != null ? divisor  : '';
    return '<div class="hissan-inputs-bar">'
      + '<div class="hissan-chip hissan-chip-total">'
      + '<label>ぜんぶの数</label>'
      + '<input id="hissanDividendInput" type="number" min="1" max="999" value="' + dv + '" placeholder="？">'
      + '</div>'
      + '<span class="hissan-div-op">÷</span>'
      + '<div class="hissan-chip hissan-chip-people">'

      + '</div>'
      + '</div>';
