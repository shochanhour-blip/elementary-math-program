      tilesMgr.render();
    });

    // ─── Tiles mode manager ───────────────────────────────

    const TILE_SVG_SIZE = 72; // px per tile card SVG
    const TILE_CX = 210, TILE_CY = 210, TILE_R = 190;
    const TILE_ARC_R_OUT = 158, TILE_ARC_W = 13;

    const tilesMgr = {
      // minTiles: array, always at least 1 entry; values 0–60
      // hourTiles: array of values 0–60 (each represents one 60-min period)
      minTiles:   [0],
      hourTiles:  [],
      editingTile: null, // { col:'min'|'hour', idx:number }
      showHourTotal:  false,

      totalTiles() { return this.minTiles.length + this.hourTiles.length; },

      reset() {
        this.minTiles      = [0];
        this.hourTiles     = [];
        this.editingTile   = null;
        this.showHourTotal = false;
        const hBtn = document.getElementById('toggleHourTotalBtn');
        if (hBtn) { hBtn.classList.remove('on'); hBtn.textContent = 'じかんをひょうじ'; }
        document.getElementById('tileEditPanel').style.display = 'none';
        this.render();
      },

      render() {
        this._renderMinCol();
        this._renderHourCol();
        this._renderEditClock();
      },

      _renderMinCol() {
        const body = document.getElementById('minColBody');
        body.innerHTML = '';
        if (this.showHourTotal) {
          const minTotal = this.minTiles.reduce((s, m) => s + m, 0);
          const minTotalCell = document.createElement('div');
          minTotalCell.className = 'tile-total-cell tile-total-min';
          minTotalCell.textContent = minTotal + '分';
          body.appendChild(minTotalCell);
        }
        this.minTiles.forEach((mins, i) => {
          const card = makeTileCard(mins, () => this._openEdit('min', i));
          if (mins === 60) this._makeDraggable(card, 'min', i);
          const wrap = document.createElement('div');
          wrap.className = 'tile-card-wrap';
          wrap.appendChild(card);
          const lbl = document.createElement('div');
          lbl.className = 'tile-card-mins';
          lbl.textContent = mins;
          wrap.appendChild(lbl);
          body.appendChild(wrap);
        });
        // Show + if last tile is full and total < 5
        const lastMin = this.minTiles[this.minTiles.length - 1];
        if (lastMin === 60 && this.totalTiles() < 5) {
          const addBtn = document.createElement('button');
          addBtn.className = 'tile-add-btn';
          addBtn.textContent = '＋';
          addBtn.addEventListener('click', () => {
            if (this.totalTiles() < 5) {
              this.minTiles.push(0);
              this.render();
            }
          });
          body.appendChild(addBtn);
        }
      },

      _renderHourCol() {
        const body = document.getElementById('hourColBody');
        body.innerHTML = '';
        if (this.showHourTotal) {
          const hourTotal = this.hourTiles.length;
          const hourTotalCell = document.createElement('div');
          hourTotalCell.className = 'tile-total-cell tile-total-hour';
          hourTotalCell.textContent = hourTotal + '時間';
          body.appendChild(hourTotalCell);
        }
        this.hourTiles.forEach((mins, i) => {
          const card = makeTileCard(mins, () => this._openEdit('hour', i));
          this._makeDraggable(card, 'hour', i);
          const wrap = document.createElement('div');
          wrap.className = 'tile-card-wrap';
          wrap.appendChild(card);
          const lbl = document.createElement('div');
          lbl.className = 'tile-card-mins';
          lbl.textContent = 1;
          wrap.appendChild(lbl);
          body.appendChild(wrap);
        });
      },

      _openEdit(col, idx) {
        this.editingTile = { col, idx };
        const mins = col === 'min' ? this.minTiles[idx] : this.hourTiles[idx];
        document.getElementById('tileEditPanel').style.display = '';
        document.getElementById('tileEditLabel').textContent = mins + ' 分';
        this._renderEditClock(mins);
        setTimeout(scaleContent, 50);
      },

      _closeEdit() {
        this.editingTile = null;
        document.getElementById('tileEditPanel').style.display = 'none';
        setTimeout(scaleContent, 50);
      },

      _setEditMinutes(mins) {
        if (!this.editingTile) return;
        const { col, idx } = this.editingTile;
        if (col === 'min') this.minTiles[idx]  = mins;
        else               this.hourTiles[idx] = mins;
        document.getElementById('tileEditLabel').textContent = mins + ' 分';
        this._renderEditClock(mins);
        // render() はドラッグ終了時のみ呼ぶ（pointerup で呼び出される）
      },

      _renderEditClock(mins) {
        if (mins === undefined) {
          if (!this.editingTile) return;
          const { col, idx } = this.editingTile;
          mins = col === 'min' ? this.minTiles[idx] : this.hourTiles[idx];
        }
        renderTileEditClock(mins);
      },

      _makeDraggable(card, col, idx) {
        let ghost = null;

        const onMove = (cx, cy) => {
          if (!ghost) return;
          ghost.style.left = (cx - 36) + 'px';
          ghost.style.top  = (cy - 36) + 'px';
          highlightDropTarget(cx, cy);
        };

        const onEnd = (cx, cy) => {
          if (!ghost) return;
          ghost.remove(); ghost = null;
          clearDropHighlights();
          const target = getColumnAtPoint(cx, cy);
          const srcMins = col === 'min' ? this.minTiles[idx] : this.hourTiles[idx];
          if (target === 'hour' && col === 'min') {
            if (this.hourTiles.length < 5) {
              this.hourTiles.push(srcMins);
              this.minTiles.splice(idx, 1);
              if (this.minTiles.length === 0) this.minTiles.push(0);
              if (this.editingTile && this.editingTile.col === 'min') {
                if (this.editingTile.idx === idx) this._closeEdit();
                else if (this.editingTile.idx > idx) this.editingTile.idx -= 1;
              }
              this.render();
            }
          } else if (target === 'min' && col === 'hour') {
            const last = this.minTiles.length - 1;
            if (this.minTiles[last] === 0) {
              this.minTiles[last] = srcMins;
            } else {
              // 先頭に挿入：末尾が端数タイルのままなので＋ボタンが誤表示されない
              this.minTiles.unshift(srcMins);
              if (this.editingTile && this.editingTile.col === 'min') {
                this.editingTile.idx += 1;
              }
            }
            this.hourTiles.splice(idx, 1);
            if (this.editingTile && this.editingTile.col === 'hour') {
              if (this.editingTile.idx === idx) this._closeEdit();
              else if (this.editingTile.idx > idx) this.editingTile.idx -= 1;
            }
            this.render();
          }
        };

        card.addEventListener('pointerdown', e => {
          e.preventDefault();
          card.setPointerCapture(e.pointerId); // 指がカード外に出てもイベントを受け取り続ける
          const startX = e.clientX, startY = e.clientY;
          let moved = false;

          const cleanup = () => {
            card.removeEventListener('pointermove',   tmpMove);
            card.removeEventListener('pointerup',     tmpUp);
            card.removeEventListener('pointercancel', tmpCancel);
          };
          const tmpMove = ev => {
            if (!moved && (Math.abs(ev.clientX - startX) > 8 || Math.abs(ev.clientY - startY) > 8)) {
              moved = true;
              ghost = document.createElement('div');
              ghost.className = 'tile-drag-ghost';
              ghost.style.width  = '148px';
              ghost.style.height = '148px';
              ghost.style.left   = (ev.clientX - 56) + 'px';
              ghost.style.top    = (ev.clientY - 56) + 'px';
              const svgNS = 'http://www.w3.org/2000/svg';
              const s = document.createElementNS(svgNS, 'svg');
              s.setAttribute('viewBox', '-28 -28 476 476');
              s.setAttribute('width', '148');
              s.setAttribute('height', '148');
              const srcMins = col === 'min' ? tilesMgr.minTiles[idx] : tilesMgr.hourTiles[idx];
              s.innerHTML = tileSmallClockSvg(srcMins);
              ghost.appendChild(s);
              document.body.appendChild(ghost);
            }
            if (moved) onMove(ev.clientX, ev.clientY);
          };
          const tmpUp = ev => {
            cleanup();
            if (moved) onEnd(ev.clientX, ev.clientY);
          };
          const tmpCancel = () => {
            cleanup();
            // キャンセル時はゴーストを消すだけ、データは変更しない
            if (ghost) { ghost.remove(); ghost = null; }
            clearDropHighlights();
          };
          card.addEventListener('pointermove',   tmpMove);
          card.addEventListener('pointerup',     tmpUp);
          card.addEventListener('pointercancel', tmpCancel);
        });
      },
    };

    // 目盛り＋0/(60)ラベルのSVG文字列（初回のみ生成してキャッシュ）
    let _tileClockFaceStr = null;
    function tileClockFaceStr() {
      if (_tileClockFaceStr) return _tileClockFaceStr;
      let s = '';
      for (let i = 0; i < 60; i++) {
        const ang     = i / 60 * 360;
        const isHour  = i % 5  === 0;
        const isQuart = i % 15 === 0;
        const len   = isQuart ? 30 : isHour ? 22 : 10;
        const width = isQuart ? 7  : isHour ? 5  : 2;
        const color = isQuart ? '#1e40af' : isHour ? '#374151' : '#94a3b8';
        const p1 = clockPtAbs(ang, TILE_R - len, TILE_CX, TILE_CY);
        const p2 = clockPtAbs(ang, TILE_R - 2,   TILE_CX, TILE_CY);
        s += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`;
      }
      const numR = TILE_R - 50;
      const pos  = clockPtAbs(0, numR, TILE_CX, TILE_CY);
      const attr = `text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="900" fill="#f87171" font-family="Noto Sans JP, Arial, sans-serif"`;
      s += `<text x="${pos.x}" y="${pos.y - 13}" ${attr}>0</text>`;
      s += `<text x="${pos.x}" y="${pos.y + 13}" ${attr}>(60)</text>`;
      _tileClockFaceStr = s;
      return s;
    }

    function tileSmallClockSvg(mins) {
      const tip = clockPtAbs(mins / 60 * 360, 148, TILE_CX, TILE_CY);
      const fan = tileArcPath(mins);
      return `
        <circle cx="${TILE_CX}" cy="${TILE_CY}" r="205" fill="#1e40af"/>
        <circle cx="${TILE_CX}" cy="${TILE_CY}" r="198" fill="#3b82f6"/>
        <circle cx="${TILE_CX}" cy="${TILE_CY}" r="190" fill="#fef9e7"/>
        ${fan}
        ${tileClockFaceStr()}
        <line stroke="#3b82f6" stroke-width="7" stroke-linecap="round"
              x1="${TILE_CX}" y1="${TILE_CY}" x2="${tip.x}" y2="${tip.y}"/>
        <circle cx="${TILE_CX}" cy="${TILE_CY}" r="14" fill="#1e40af"/>
        <circle cx="${TILE_CX}" cy="${TILE_CY}" r="8"  fill="#fff"/>
        <circle cx="${TILE_CX}" cy="${TILE_CY}" r="4"  fill="#f87171"/>
      `;
    }

    // 扇型（中心から外縁への塗りつぶし）
    function tileArcPath(mins) {
      if (mins <= 0) return '';
      if (mins >= 60) {
        // 完全な円（2つの半円で表現）
        const top = clockPtAbs(0,   TILE_R, TILE_CX, TILE_CY);
        const bot = clockPtAbs(180, TILE_R, TILE_CX, TILE_CY);
        return `<path d="M ${top.x} ${top.y} A ${TILE_R} ${TILE_R} 0 1 1 ${bot.x} ${bot.y} A ${TILE_R} ${TILE_R} 0 1 1 ${top.x} ${top.y} Z" fill="#fb923c" opacity="0.35"/>`;
      }
      const dur   = Math.min(mins, 59.99);
      const large = dur > 30 ? 1 : 0;
      const p1 = clockPtAbs(0,               TILE_R, TILE_CX, TILE_CY);
      const p2 = clockPtAbs(dur / 60 * 360,  TILE_R, TILE_CX, TILE_CY);
      return `<path d="M ${TILE_CX} ${TILE_CY} L ${p1.x} ${p1.y} A ${TILE_R} ${TILE_R} 0 ${large} 1 ${p2.x} ${p2.y} Z" fill="#fb923c" opacity="0.35"/>`;
    }

    function clockPtAbs(angleDeg, radius, cx, cy) {
      const rad = (angleDeg - 90) * Math.PI / 180;
      return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
    }

    function makeTileCard(mins, onTap) {
      const isFull = mins === 60;
      const div = document.createElement('div');
      div.className = 'tile-card' + (isFull ? ' full' : '');
      div.style.width = div.style.height = '148px';
      div.style.overflow = 'hidden';
      const svgNS = 'http://www.w3.org/2000/svg';
      const s = document.createElementNS(svgNS, 'svg');
      s.setAttribute('viewBox', '-28 -28 476 476');
      s.setAttribute('width', '148');
      s.setAttribute('height', '148');
      s.innerHTML = tileSmallClockSvg(mins);
      div.appendChild(s);
      div.addEventListener('pointerup', e => {
        if (Math.abs(e.clientX - (div._pdX||e.clientX)) < 5 && Math.abs(e.clientY - (div._pdY||e.clientY)) < 5) {
          onTap();
        }
      });
      div.addEventListener('pointerdown', e => { div._pdX = e.clientX; div._pdY = e.clientY; });
      return div;
    }

    // ─── Tile edit clock ──────────────────────────────────

    let tileEditDrag = null;

    function renderTileEditClock(mins) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('tileEditSvg');

      // Ticks — same style as main clock
      const tickG = document.getElementById('tileEditTicksGroup');
      if (!tickG._rendered) {
        tickG.innerHTML = '';
        for (let i = 0; i < 60; i++) {
          const ang     = i / 60 * 360;
          const isHour  = i % 5 === 0;
          const isQuart = i % 15 === 0;
          const len   = isQuart ? 30 : isHour ? 22 : 10;
          const width = isQuart ? 7  : isHour ? 5  : 2;
          const color = isQuart ? '#1e40af' : isHour ? '#374151' : '#94a3b8';
          const p1 = clockPtAbs(ang, TILE_R - len, TILE_CX, TILE_CY);
          const p2 = clockPtAbs(ang, TILE_R - 2,   TILE_CX, TILE_CY);
          const ln = document.createElementNS(ns, 'line');
          ln.setAttribute('x1', p1.x); ln.setAttribute('y1', p1.y);
          ln.setAttribute('x2', p2.x); ln.setAttribute('y2', p2.y);
          ln.setAttribute('stroke', color);
          ln.setAttribute('stroke-width', width);
          ln.setAttribute('stroke-linecap', 'round');
          tickG.appendChild(ln);
        }
        tickG._rendered = true;
      }

      // Numbers — conv style: only 0 and (60) at 12 o'clock in soft red
      const numG = document.getElementById('tileEditNumbersGroup');
      if (!numG._rendered) {
        numG.innerHTML = '';
        const numR = TILE_R - 50;
        const pos  = clockPtAbs(0, numR, TILE_CX, TILE_CY);
        function addConvLabel(x, y, text) {
          const t = document.createElementNS(ns, 'text');
          t.setAttribute('x', x); t.setAttribute('y', y);
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('dominant-baseline', 'central');
          t.setAttribute('font-size', '24');
          t.setAttribute('font-weight', '900');
          t.setAttribute('fill', '#f87171');
          t.setAttribute('font-family', 'Noto Sans JP, Arial, sans-serif');
          t.textContent = text;
          numG.appendChild(t);
        }
        addConvLabel(pos.x, pos.y - 13, '0');
        addConvLabel(pos.x, pos.y + 13, '(60)');
        numG._rendered = true;
      }

      // Arc
      const arcG = document.getElementById('tileEditArcGroup');
      arcG.innerHTML = mins > 0 ? tileArcPath(mins) : '';

      // Hand
      const hand = document.getElementById('tileEditHand');
      const tip  = clockPtAbs(mins / 60 * 360, 148, TILE_CX, TILE_CY);
      hand.setAttribute('x2', tip.x);
      hand.setAttribute('y2', tip.y);

      // Drag (bind once)
      if (!tileEditDrag) {
        tileEditDrag = { active: false, prevAngle: null, floatMins: 0 };
        svg.addEventListener('pointerdown', e => {
          e.preventDefault();
          svg.setPointerCapture(e.pointerId);
          tileEditDrag.active = true;
          tileEditDrag.prevAngle = null;
          // 整数に丸めた値ではなく、現在の値をそのまま浮動小数として保持
          if (tilesMgr.editingTile) {
            const { col, idx } = tilesMgr.editingTile;
            tileEditDrag.floatMins = col === 'min' ? tilesMgr.minTiles[idx] : tilesMgr.hourTiles[idx];
          }
        });
        svg.addEventListener('pointermove', e => {
          if (!tileEditDrag.active || !tilesMgr.editingTile) return;
          const rect = svg.getBoundingClientRect();
          const svgScale = 420 / rect.width;
          const lx = (e.clientX - rect.left) * svgScale;
          const ly = (e.clientY - rect.top)  * svgScale;
          const angle = Math.atan2(lx - TILE_CX, -(ly - TILE_CY)) * 180 / Math.PI;
          const normAngle = (angle + 360) % 360;
          if (tileEditDrag.prevAngle === null) {
            tileEditDrag.prevAngle = normAngle;
            return;
          }
          let delta = normAngle - tileEditDrag.prevAngle;
          if (delta > 180)  delta -= 360;
          if (delta < -180) delta += 360;
          tileEditDrag.prevAngle = normAngle;
          // floatMins で連続的に累積（丸め誤差なし）
          tileEditDrag.floatMins = Math.max(0, Math.min(60, tileEditDrag.floatMins + delta / 360 * 60));
          // 表示は丸めた値で更新するが、minTiles への書き戻しはしない
          const displayMins = Math.round(tileEditDrag.floatMins);
          document.getElementById('tileEditLabel').textContent = displayMins + ' 分';
          updateTileEditClockDisplay(displayMins);
        });
        const commitDrag = () => {
          if (!tileEditDrag.active) return;
          tileEditDrag.active = false;
          if (tilesMgr.editingTile) {
            const { col, idx } = tilesMgr.editingTile;
            const finalMins = Math.round(tileEditDrag.floatMins);
            if (col === 'min') tilesMgr.minTiles[idx]  = finalMins;
            else               tilesMgr.hourTiles[idx] = finalMins;
          }
          tilesMgr.render(); // 確定後に一度だけタイル再描画
        };
        svg.addEventListener('pointerup',     commitDrag);
        svg.addEventListener('pointercancel', commitDrag);
      }
    }

    // ドラッグ中の軽量更新（弧と針の属性のみ、DOM再生成なし）
    function updateTileEditClockDisplay(mins) {
      // 弧: innerHTML でパス文字列を差し替えるだけ（軽量）
      document.getElementById('tileEditArcGroup').innerHTML = mins > 0 ? tileArcPath(mins) : '';
      // 針: 属性書き換えのみ
      const tip  = clockPtAbs(mins / 60 * 360, 148, TILE_CX, TILE_CY);
      const hand = document.getElementById('tileEditHand');
      hand.setAttribute('x2', tip.x);
      hand.setAttribute('y2', tip.y);
    }

    // Close tile edit when tapping outside
    document.addEventListener('pointerdown', e => {
      if (convSubMode !== 'tiles') return;
      const ep = document.getElementById('tileEditPanel');
      if (ep.style.display === 'none') return;
      if (!ep.contains(e.target)) {
        tilesMgr._closeEdit();
      }
    });

    // ─── Drag-drop helpers ────────────────────────────────

    function getColumnAtPoint(cx, cy) {
      const hb = document.getElementById('hourColBody');
      const mb = document.getElementById('minColBody');
      const hr = hb.getBoundingClientRect();
      const mr = mb.getBoundingClientRect();
      if (cx >= hr.left && cx <= hr.right && cy >= hr.top - 20 && cy <= hr.bottom + 20) return 'hour';
      if (cx >= mr.left && cx <= mr.right && cy >= mr.top - 20 && cy <= mr.bottom + 20) return 'min';
      return null;
    }

    function highlightDropTarget(cx, cy) {
      const target = getColumnAtPoint(cx, cy);
      document.getElementById('hourColBody').classList.toggle('drag-over', target === 'hour');
      document.getElementById('minColBody').classList.toggle('drag-over', target === 'min');
    }

    function clearDropHighlights() {
      document.getElementById('hourColBody').classList.remove('drag-over');
      document.getElementById('minColBody').classList.remove('drag-over');
    }

    // ─── タイルモード 手書きキャンバス（2列） ────────────

    const tileDrawInited = new Set();

    function attachDrawCanvas(canvasId, clearBtnId) {
      if (tileDrawInited.has(canvasId)) return;
      tileDrawInited.add(canvasId);

      const canvas = document.getElementById(canvasId);
      const dpr    = window.devicePixelRatio || 1;

      // 解像度をCSS表示サイズに合わせる
      const rect = canvas.getBoundingClientRect();
      canvas.width  = rect.width  * dpr;
      canvas.height = rect.height * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.strokeStyle = '#1f2933';
      ctx.lineWidth   = 4;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      let drawing = false;

      function canvasPos(e) {
        const r = canvas.getBoundingClientRect();
        return [e.clientX - r.left, e.clientY - r.top];
      }

      canvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        e.stopPropagation();
        canvas.setPointerCapture(e.pointerId);
        drawing = true;
        ctx.beginPath();
        ctx.moveTo(...canvasPos(e));
      });
      canvas.addEventListener('pointermove', e => {
        if (!drawing) return;
        e.preventDefault();
        ctx.lineTo(...canvasPos(e));
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(...canvasPos(e));
      });
      canvas.addEventListener('pointerup',     () => { drawing = false; });
      canvas.addEventListener('pointercancel', () => { drawing = false; });

      document.getElementById(clearBtnId).addEventListener('click', () => {
        const r = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, r.width * dpr, r.height * dpr);
      });
    }

    function initTileDrawCanvases() {
      // requestAnimationFrame でレイアウト確定後に初期化
      requestAnimationFrame(() => {
        attachDrawCanvas('hourDrawCanvas', 'hourDrawClear');
        attachDrawCanvas('minDrawCanvas',  'minDrawClear');
      });
    }

    // ─── Init ────────────────────────────────────────────
    renderTicks();
    render();

    // 数直線パネルをデフォルトで開く
    numlineVisible = true;
    document.getElementById('numlinePanel').classList.add('open');
    document.getElementById('numlineHandleBtn').textContent = '▼';
    document.getElementById('numlineModeSelect').style.display = '';
    document.getElementById('drawModeBtn').style.display  = '';
    document.getElementById('drawClearBtn').style.display = '';
    document.getElementById('nlMemBtn').style.display     = '';
    renderNumline();
    setTimeout(scaleContent, 50);
  </script>
</body>
</html>
