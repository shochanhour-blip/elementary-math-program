<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>がいすう</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1f2933;
      --warn: #d4574f;
      --blue: #1e88e5;
      --blue-dark: #1565c0;
      --orange: #ef8b25;
      --orange-dark: #d97a12;
      --mid: #78909c;
      --mid-dark: #546e7a;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
      background: #f7f9fc;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 16px 12px;
    }
    :focus-visible { outline: 3px solid #1e88e5; outline-offset: 2px; }

    .board {
      width: 100%;
      max-width: 1100px;
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 10px 10px 6px;
    }
    .board-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }
    .head-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* いちばん 上の、しらべたい 数を 書くところ */
    .target {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }
    #targetBox, #quizNumBox { border-color: #8bc34a; }
    #targetBox:hover { background: #f5faee; }
    #targetBox.editing { box-shadow: 0 0 0 4px #dcedc8; }
    /* しらべたい数が 入ったら、こたえの 欄は あかく なって 入力を まつ */
    #quizAnsBox { border-color: #e53935; }
    #quizAnsBox:hover { background: #fdf3f2; }
    #quizAnsBox.editing { box-shadow: 0 0 0 4px #ffcdd2; }
    /* からっぽの あいだは ほかの 欄と おなじ グレーの 点線 */
    #targetBox.empty, #quizNumBox.empty { border-color: #cfd8e3; }
    #quizAnsBox:disabled { border-color: #cfd8e3; }

    /* 子どもが じぶんで しきと こたえを 書くところ（カードの そと・上のよはく） */
    .quiz {
      display: grid;
      grid-template-columns: 1fr auto 1fr;   /* まんなかを 画面の 中心に そろえる */
      align-items: center;
      gap: 16px;
      margin-bottom: 42px;
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
    }
    .quiz-core { display: flex; align-items: center; justify-content: center; gap: 16px; }
    .quiz-side { display: flex; align-items: center; gap: 10px; }
    .quiz-side--l { justify-content: flex-end; }
    .quiz-side--r { justify-content: flex-start; }
    .quiz .arrow { font-size: 30px; color: #52606d; }
    .quiz rt { font-size: .42em; font-weight: 700; color: #6b7280; }
    .quiz-box {
      min-width: 150px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      color: var(--text);
      background: #fff;
      border: 3px solid #cfd8e3;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-box.empty { border-style: dashed; }
    .quiz-box.empty::after { content: "\00a0"; }
    .quiz-box:hover { background: #f4f7fb; }
    .quiz-box.editing { box-shadow: 0 0 0 4px #e3e8ee; }
    .quiz-box.mirror { cursor: default; }
    .quiz-box.mirror:hover { background: #fff; }
    .quiz-box:disabled { cursor: default; opacity: .5; }
    /* まるつけ */
    .judge-btn {
      display: inline-flex;
      align-items: center;
      padding: 10px 12px;
      color: var(--blue-dark);
      background: #fff;
      border: 3px solid #90caf9;
      border-radius: 14px;
      cursor: pointer;
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .judge-btn svg { display: block; }
    .judge-btn:hover { background: #e3f2fd; }
    .judge-btn:disabled { color: #d7dee7; border-color: #e6ebf1; background: #fff; cursor: default; }
    .judge-mark {
      width: 48px; height: 48px;
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
    }
    .tool-btn {
      padding: 9px 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      color: var(--blue-dark);
      background: #fff;
      border: 2.5px solid #90caf9;
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tool-btn--icon { display: inline-flex; align-items: center; padding: 8px 12px; }
    .tool-btn--icon svg { display: block; }
    .tool-btn:hover { background: #e3f2fd; }
    .tool-btn[aria-pressed="true"] {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
      color: #fff;
    }
    .tool-btn:disabled {
      color: #b0bac4;
      border-color: #dbe3ec;
      background: #f7f9fc;
      cursor: default;
    }
    /* めもりの かずの きりかえ */
    .seg {
      display: flex;
      border: 2.5px solid #90caf9;
      border-radius: 12px;
      overflow: hidden;
      margin-right: auto;
    }
    .seg-btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      color: var(--blue-dark);
      background: #fff;
      border: none;
      cursor: pointer;
      transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .seg-btn svg { display: block; }
    .seg-btn + .seg-btn { border-left: 2.5px solid #90caf9; }
    .seg-btn:hover { background: #e3f2fd; }
    .seg-btn[aria-pressed="true"] { background: var(--blue-dark); color: #fff; }

    /* SVG と、そのうえに重ねる入力ボックスの土台 */
    .stage { position: relative; }
    svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .grabzone { cursor: grab; }
    /* ▲がまだ無いあいだ、うすい点線の▲でタップをさそう */
    .ghost { animation: ghost-pulse 2.4s ease-in-out infinite; }
    @keyframes ghost-pulse { 0%, 100% { opacity: .38; } 50% { opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { .ghost { animation: none; opacity: .55; } }
    svg.dragging, svg.dragging .grabzone { cursor: grabbing; }

    /* 数直線の始点・終点のうえに置く入力ボックス（めもりの数より一段うえの行） */
    .axis-box {
      position: absolute;
      top: 37%;                       /* JS が 数直線の 高さに あわせて 出しなおす */
      transform: translate(-50%, -100%);
      min-width: clamp(86px, 14%, 158px);
      padding: 6px 12px 7px;
      font-family: inherit;
      font-size: clamp(15px, 2.1vw, 23px);
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      color: var(--text);
      background: #fff;
      border: 3px solid var(--blue);
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .10);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    /* からっぽのときは点線にして、入力をさそう */
    .axis-box.empty { border-style: dashed; }
    .axis-box.empty::after { content: "\00a0"; }
    .axis-box:hover { background: #f4f9ff; }
    .axis-box.editing { box-shadow: 0 0 0 4px #bbdefb; }
    .axis-box.invalid {
      color: var(--warn);
      border-color: var(--warn);
      background: #fdeeed;
    }
    #startBox { left: 11%; }
    #midBox   { left: 50%; border-color: var(--mid); }
    #midBox.editing { box-shadow: 0 0 0 4px #cfd8dc; }
    #midBox:hover { background: #f5f7f8; }
    #endBox   { left: 89%; border-color: var(--orange); }
    #endBox.editing { box-shadow: 0 0 0 4px #ffe0b2; }
    #endBox:hover { background: #fff8ef; }

    /* ── こうほ の パネル ── */
    #cand-holder {
      position: fixed;
      left: 0; right: 0;
      bottom: max(10px, env(safe-area-inset-bottom));
      display: flex; justify-content: center;
      z-index: 195; padding: 0 12px;
      pointer-events: none;
    }
    #cand {
      pointer-events: auto;
      background: #fff;
      border: 2px solid #dbe3ec;
      border-radius: 18px;
      padding: 12px 14px 14px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, .26);
      width: 340px; max-width: 100%;
    }
    #cand-title { font-size: .98rem; font-weight: 800; color: var(--blue-dark); }
    #cand-close {
      background: none; border: none; font-size: 1.1rem; line-height: 1;
      color: #6b7280; cursor: pointer; padding: 4px 6px;
    }
    #cand-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .cand-item {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 12px 8px;
      font-family: inherit; font-size: 1.2rem; font-weight: 800;
      color: var(--text); background: #f1f5fa;
      border: 2px solid #dbe3ec; border-radius: 12px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .cand-item:hover  { background: #e3f2fd; }
    .cand-item:active { background: #dbe7f5; transform: translateY(1px); }
    .cand-item .sep { color: #90a4ae; font-weight: 700; }

    /* ── がめんの テンキー（数直線をかくさないよう、下によせて出す） ── */
    #pad-holder {
      position: fixed;
      left: 0; right: 0;
      bottom: max(10px, env(safe-area-inset-bottom));
      display: flex; justify-content: center;
      z-index: 195; padding: 0 12px;
      pointer-events: none;
    }
    #pad {
      pointer-events: auto;
      background: #fff;
      border: 2px solid #dbe3ec;
      border-radius: 18px;
      padding: 12px 14px 14px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, .26);
      width: 300px; max-width: 100%;
    }
    .pad-head { display: flex; align-items: center; justify-content: space-between; }
    #pad-title { font-size: .98rem; font-weight: 800; color: var(--blue-dark); }
    #pad-title.mid { color: var(--mid-dark); }
    #pad-title.end { color: var(--orange-dark); }
    #pad-close {
      background: none; border: none; font-size: 1.1rem; line-height: 1;
      color: #6b7280; cursor: pointer; padding: 4px 6px;
    }
    #pad-display {
      font-size: 1.9rem; font-weight: 900; text-align: center;
      padding: 6px 10px; margin: 6px 0 4px;
      border: 3px solid #cfd8e3; border-radius: 12px;
      min-height: 54px; letter-spacing: .04em;
    }
    #pad-display.invalid { color: var(--warn); border-color: var(--warn); background: #fdeeed; }
    /* つぎの数字が どこに入るかを しめすカーソル */
    #pad-caret {
      display: inline-block;
      width: 3px; height: 1.05em;
      vertical-align: -.14em;
      margin-left: 3px;
      background: var(--blue-dark);
      animation: caret-blink 1.06s step-end infinite;
    }
    #pad-display.mid #pad-caret { background: var(--mid-dark); }
    #pad-display.end #pad-caret { background: var(--orange-dark); }
    #pad-display.invalid #pad-caret { background: var(--warn); }
    @keyframes caret-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #pad-caret { animation: none; } }
    #pad-hint {
      font-size: .8rem; font-weight: 700; line-height: 1.4;
      color: var(--warn); text-align: center;
      min-height: 2.4em; padding: 2px 0 4px;
    }
    #pad-hint.ok { color: #2e7d32; }
    .pad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .pad-key {
      padding: 13px 0;
      font-family: inherit; font-size: 1.45rem; font-weight: 800;
      color: var(--text); background: #f1f5fa;
      border: 2px solid #dbe3ec; border-radius: 12px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .pad-key:active { background: #dbe7f5; transform: translateY(1px); }
    .pad-key.sub {
      font-size: .88rem; color: #52606d;
      white-space: nowrap; letter-spacing: -.02em; padding: 13px 2px;
    }
  </style>
</head>
<body>
  <div class="target">
    <button id="targetBox" class="quiz-box empty" aria-label="しらべたい数"></button>
  </div>

  <div class="quiz">
    <div class="quiz-side quiz-side--l"></div>

    <div class="quiz-core">
      <button id="quizNumBox" class="quiz-box empty mirror" aria-label="もとの数" tabindex="-1"></button>
      <span class="arrow" aria-hidden="true">→</span>
      <span><ruby>約<rt>やく</rt></ruby></span>
      <button id="quizAnsBox" class="quiz-box empty" aria-label="約の数"></button>
    </div>

    <div class="quiz-side quiz-side--r">
    <span id="judgeMark" class="judge-mark" aria-live="polite"></span>
    <button id="judgeBtn" class="judge-btn" aria-label="まるつけ" title="まるつけ" disabled>
      <svg width="32" height="30" viewBox="0 0 32 30" aria-hidden="true">
        <polyline points="4,16 12,24 28,6" fill="none" stroke="currentColor"
                  stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    </div>
  </div>

  <main class="board">
    <div class="board-head">
      <button id="candBtn" class="tool-btn tool-btn--icon" aria-label="こうほから えらぶ" title="こうほから えらぶ" disabled>
        <svg width="30" height="26" viewBox="0 0 30 26" aria-hidden="true">
        <g stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
          <line x1="4" y1="5"  x2="26" y2="5"/>
          <line x1="4" y1="13" x2="22" y2="13"/>
          <line x1="4" y1="21" x2="18" y2="21"/>
        </g>
        </svg>
      </button>
      <div class="head-tools">
        <div class="seg" role="group" aria-label="めもりの せってい">
          <button id="tickBtn" class="seg-btn" aria-pressed="false"
                  aria-label="あいだの めもりを けす" title="あいだの めもりを けす">
            <svg width="54" height="26" viewBox="0 0 54 26" aria-hidden="true">
              <line x1="3" y1="15" x2="51" y2="15" stroke="currentColor" stroke-width="2"/>
              <g stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
                <line x1="9" y1="6" x2="9" y2="24"/>
                <line x1="45" y1="6" x2="45" y2="24"/>
              </g>
            </svg>
          </button>
          <button class="seg-btn" data-div="10" aria-pressed="true"
                  aria-label="おおきい めもり 2つ" title="おおきい めもり 2つ">
            <svg width="54" height="26" viewBox="0 0 54 26" aria-hidden="true">
              <line x1="3" y1="15" x2="51" y2="15" stroke="currentColor" stroke-width="2"/>
              <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".65">
                <line x1="18" y1="10" x2="18" y2="20"/>
                <line x1="27" y1="10" x2="27" y2="20"/>
                <line x1="36" y1="10" x2="36" y2="20"/>
              </g>
              <g stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
                <line x1="9" y1="6" x2="9" y2="24"/>
                <line x1="45" y1="6" x2="45" y2="24"/>
              </g>
            </svg>
          </button>
          <button class="seg-btn" data-div="20" aria-pressed="false"
                  aria-label="おおきい めもり 3つ" title="おおきい めもり 3つ">
            <svg width="54" height="26" viewBox="0 0 54 26" aria-hidden="true">
              <line x1="3" y1="15" x2="51" y2="15" stroke="currentColor" stroke-width="2"/>
              <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".65">
                <line x1="15" y1="10" x2="15" y2="20"/>
                <line x1="21" y1="10" x2="21" y2="20"/>
                <line x1="33" y1="10" x2="33" y2="20"/>
                <line x1="39" y1="10" x2="39" y2="20"/>
              </g>
              <g stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
                <line x1="9" y1="6" x2="9" y2="24"/>
                <line x1="27" y1="6" x2="27" y2="24"/>
                <line x1="45" y1="6" x2="45" y2="24"/>
              </g>
            </svg>
          </button>
        </div>
        <button id="clearBtn" class="tool-btn" disabled>▲を けす</button>
      </div>
    </div>
    <div class="stage">
      <svg id="svg" viewBox="0 0 1000 260" aria-label="がいすうの数直線">
        <g id="links"></g>
        <g id="bands"></g>
        <g id="ticks"></g>
        <g id="tickLabels"></g>
        <g id="marker"></g>
        <g id="sel"></g>
        <g id="zoomG"></g>
      </svg>
      <button id="startBox" class="axis-box empty" aria-label="はじめの数"></button>
      <button id="midBox" class="axis-box empty" aria-label="まんなかの数" style="display:none"></button>
      <button id="endBox" class="axis-box empty" aria-label="おわりの数"></button>
    </div>
  </main>

  <div id="cand-holder" style="display:none">
    <div id="cand">
      <div class="pad-head">
        <span id="cand-title">こうほ</span>
        <button id="cand-close" aria-label="とじる">✕</button>
      </div>
      <div id="cand-list"></div>
    </div>
  </div>

  <div id="pad-holder" style="display:none">
    <div id="pad">
      <div class="pad-head">
        <span id="pad-title"></span>
        <button id="pad-close" aria-label="とじる">✕</button>
      </div>
      <div id="pad-display"><span id="pad-value"></span><span id="pad-caret"></span></div>
      <div id="pad-hint"></div>
      <div class="pad-grid">
        <button class="pad-key" data-key="1">1</button>
        <button class="pad-key" data-key="2">2</button>
        <button class="pad-key" data-key="3">3</button>
        <button class="pad-key" data-key="4">4</button>
        <button class="pad-key" data-key="5">5</button>
        <button class="pad-key" data-key="6">6</button>
        <button class="pad-key" data-key="7">7</button>
        <button class="pad-key" data-key="8">8</button>
        <button class="pad-key" data-key="9">9</button>
        <button class="pad-key sub" data-key="clear">ぜんぶけす</button>
        <button class="pad-key" data-key="0">0</button>
        <button class="pad-key sub" data-key="back">← けす</button>
      </div>
    </div>
  </div>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";

    // ── ジオメトリ（viewBox 0 0 1000 260 の座標系） ──
    const START_X = 110;
    const END_X   = 890;
    const SPAN_PX = END_X - START_X;   // 780
    const LINE_Y  = 170;
    const LINE_X0 = 12;
    const LINE_X1 = 988;
    const BAND_H   = 32;               // ハイライトは数直線の上半分だけ
    const BAND_TOP = LINE_Y - BAND_H;
    const LABEL_Y  = BAND_TOP - 10;    // めもりの数のベースライン
    const TRI_SIDE = 28;               // ▲は正三角形
    const TRI_H    = TRI_SIDE * Math.sqrt(3) / 2;
    const TRI_GAP  = 6;                // ▲の頂点と数直線のあいだ

    // となりあうボックスどうしの「さ」としてゆるすもの
    const STEPS = [10, 100, 1000, 10000, 100000];
    const MAX_VALUE = 1000000;
    const MAX_DIGITS = 7;
    const TARGET_SNAP = 5;    // しらべたい数への すいつき（viewBox の はば）

    const state = {
      start: null,       // まだ有効な数が入っていなければ null
      mid: null,         // めもり21のときの まんなかの数
      end: null,
      marker: null,      // ▲がさす数。null なら未配置
      zooms: [],         // 拡大した数直線。[{start, end, marker}] 上から順に
      tickSel: null,     // えらんだ めもり {level, i, j}。level -1 は いちばん上の線
      showTicks: true,   // 始点と終点の あいだの めもりの 数
      divisions: 10,     // 10分割（めもり11こ）／20分割（めもり21こ）
      judged: null,      // まるつけの けっか。true / false / null（まだ）
      // ボックスに見えている文字。これが入力の実体
      text: { start: "", mid: "", end: "", quizNum: "", quizAns: "", target: "" },
      editing: null      // ボックスの名まえ／null
    };

    // 数直線のうえの、チェックのたいしょうになるボックス
    function fields() { return state.divisions === 20 ? ["start", "mid", "end"] : ["start", "end"]; }
    // 子どもが じゆうに 書くところ（チェックしない）
    const QUIZ_FIELDS = ["quizNum", "quizAns", "target"];
    const ALL_FIELDS = ["start", "mid", "end", ...QUIZ_FIELDS];

    const svg      = document.getElementById("svg");
    const bandsG   = document.getElementById("bands");
    const ticksG   = document.getElementById("ticks");
    const labelsG  = document.getElementById("tickLabels");
    const markerG  = document.getElementById("marker");
    const selG     = document.getElementById("sel");
    const linksG   = document.getElementById("links");
    const zoomG    = document.getElementById("zoomG");
    const clearBtn = document.getElementById("clearBtn");
    const tickBtn  = document.getElementById("tickBtn");
    const boxes    = {
      start: document.getElementById("startBox"),
      mid:   document.getElementById("midBox"),
      end:   document.getElementById("endBox"),
      quizNum: document.getElementById("quizNumBox"),
      quizAns: document.getElementById("quizAnsBox"),
      target:  document.getElementById("targetBox")
    };
    const candBtn   = document.getElementById("candBtn");
    const candHold  = document.getElementById("cand-holder");
    const candEl    = document.getElementById("cand");
    const candList  = document.getElementById("cand-list");
    const judgeBtn  = document.getElementById("judgeBtn");
    const judgeMark = document.getElementById("judgeMark");
    const padHold  = document.getElementById("pad-holder");
    const padEl    = document.getElementById("pad");
    const padTitle = document.getElementById("pad-title");
    const padDisp  = document.getElementById("pad-display");
    const padValue = document.getElementById("pad-value");
    const padHint  = document.getElementById("pad-hint");

    function el(name, attrs) {
      const node = document.createElementNS(SVG_NS, name);
      for (const key in attrs) node.setAttribute(key, attrs[key]);
      return node;
    }

    function hasRange() { return state.start !== null && state.end !== null; }
    function centerValue() { return (state.start + state.end) / 2; }
    function span() { return state.end - state.start; }
    function valueToX(v) { return START_X + (v - state.start) / span() * SPAN_PX; }
    // はんいの なかに ある「しらべたい数」
    function targetIn(s, e) {
      const raw = state.text.target;
      if (raw === "") return null;
      const v = Number(raw);
      if (!Number.isInteger(v) || v < s || v > e) return null;
      return v;
    }
    function targetValue() { return hasRange() ? targetIn(state.start, state.end) : null; }

    // どの数直線でも つかえる 値⇔座標
    function xOf(v, s, e) { return START_X + (v - s) / (e - s) * SPAN_PX; }
    function vOf(x, s, e) {
      const v = s + (x - START_X) / SPAN_PX * (e - s);
      const t = targetIn(s, e);
      if (t !== null && Math.abs(xOf(t, s, e) - x) <= TARGET_SNAP) return t;
      return Math.min(e, Math.max(s, Math.round(v)));
    }
    function fsFor(endVal, div) {
      const digits = String(endVal).length;
      const avail = SPAN_PX / div - 6;
      return Math.max(9, Math.min(23, Math.floor(avail / (digits * 0.6))));
    }
    const LEVEL_H = 260;                       // 数直線 1本ぶんの 高さ
    function totalH() { return LEVEL_H * (1 + state.zooms.length); }
    function svgPt(ev) {
      const r = svg.getBoundingClientRect();
      return { x: (ev.clientX - r.left) * (1000 / r.width),
               y: (ev.clientY - r.top) * (totalH() / r.height) };
    }

    // めもりの数が横に並びきるよう、けた数にあわせて字を小さくする
    function tickFontSize() {
      return fsFor(hasRange() ? state.end : 1000, state.divisions);
    }

    // ── めもり・線・めもりの数（始点／終点がかわったときだけ） ──
    function renderAll() {
      ticksG.textContent = "";
      labelsG.textContent = "";

      ticksG.appendChild(el("line", {
        x1: LINE_X0, y1: LINE_Y, x2: LINE_X1, y2: LINE_Y,
        stroke: "#1f2933", "stroke-width": 3
      }));

      const ranged = hasRange();
      const div = state.divisions;
      const gap = SPAN_PX / div;
      const step = ranged ? span() / div : 0;
      const fs = tickFontSize();

      for (let i = -1; i <= div + 1; i++) {
        const x = START_X + i * gap;
        const inRange = i >= 0 && i <= div;
        // ボックスがのっているめもり（はじめ・まんなか・おわり）は大きく
        const isEdge  = i === 0 || i === div || (div === 20 && i === 10);

        // 「あいだなし」のときは、ボックスがのっている めもりだけ のこす
        if (!state.showTicks && !isEdge) continue;

        const half = isEdge ? 24 : 13;
        ticksG.appendChild(el("line", {
          x1: x, y1: LINE_Y - half, x2: x, y2: LINE_Y + half,
          stroke: inRange ? "#1f2933" : "#b0bac4",
          "stroke-width": isEdge ? 4 : 2.5,
          "stroke-linecap": "round"
        }));

        // 始点と終点の数は入力ボックスがしめしている
        if (!ranged || !inRange || isEdge) continue;

        const label = el("text", {
          x: x, y: LABEL_Y,
          "text-anchor": "middle",
          "font-size": fs,
          "font-weight": 700,
          fill: "#52606d"
        });
        label.textContent = String(state.start + i * step);
        labelsG.appendChild(label);
      }

      renderMarker();
      drawSel(selG, -1);
    }

    // ── ▲・ハイライト・▲の数（ドラッグ中はここだけ） ──
    function renderMarker() {
      bandsG.textContent = "";
      markerG.textContent = "";
      clearBtn.disabled = state.marker === null;

      if (!hasRange()) return;   // 数がそろうまで▲は出さない

      if (state.marker === null) {
        const gx = (START_X + END_X) / 2;
        const gy = LINE_Y + TRI_GAP;
        markerG.appendChild(el("polygon", {
          class: "ghost",
          points: `${gx},${gy} ${gx - TRI_SIDE / 2},${gy + TRI_H} ${gx + TRI_SIDE / 2},${gy + TRI_H}`,
          fill: "#e57373", "fill-opacity": .22,
          stroke: "#e57373", "stroke-width": 2,
          "stroke-dasharray": "4 4", "stroke-linejoin": "round"
        }));
        return;
      }

      const mx = valueToX(state.marker);

      // めもり21のときは、▲がいる がわの ボックスどうしで くらべる
      let loX = START_X, hiX = END_X;
      if (state.divisions === 20 && state.mid !== null) {
        const midX = valueToX(state.mid);
        if (mx <= midX) hiX = midX; else loX = midX;
      }

      bandsG.appendChild(el("rect", {
        x: loX, y: BAND_TOP, width: Math.max(0, mx - loX), height: BAND_H,
        fill: "#64b5f6", "fill-opacity": 0.32
      }));
      bandsG.appendChild(el("rect", {
        x: mx, y: BAND_TOP, width: Math.max(0, hiX - mx), height: BAND_H,
        fill: "#ffb74d", "fill-opacity": 0.45
      }));
      bandsG.appendChild(el("line", {
        x1: mx, y1: BAND_TOP, x2: mx, y2: LINE_Y,
        stroke: "#e57373", "stroke-width": 2.5
      }));

      const top = LINE_Y + TRI_GAP;
      markerG.appendChild(el("polygon", {
        points: `${mx},${top} ${mx - TRI_SIDE / 2},${top + TRI_H} ${mx + TRI_SIDE / 2},${top + TRI_H}`,
        fill: "#e57373", stroke: "#cf6161", "stroke-width": 1.5, "stroke-linejoin": "round"
      }));
      // ▲は「つまんで動かすもの」と伝えるための、見えないつかみしろ
      markerG.appendChild(el("rect", {
        x: mx - 28, y: LINE_Y, width: 56, height: 46,
        fill: "transparent", class: "grabzone"
      }));

      const text = String(state.marker);
      const w = 30 + text.length * 15;
      const bx = Math.min(END_X + 40 - w, Math.max(START_X - 40, mx - w / 2));
      const by = top + TRI_H + 8;

      const onTarget = state.marker === targetValue();
      markerG.appendChild(el("rect", {
        x: bx, y: by, width: w, height: 40, rx: 10,
        fill: "#fff", stroke: onTarget ? "#8bc34a" : "#e57373",
        "stroke-width": onTarget ? 3.5 : 2.5
      }));
      const t = el("text", {
        x: bx + w / 2, y: by + 28,
        "text-anchor": "middle", "font-size": 23, "font-weight": 900,
        fill: onTarget ? "#5f8f2e" : "#c96060"
      });
      t.textContent = text;
      markerG.appendChild(t);
    }

    // ── めもりを えらんで 拡大する ──
    const SEL_C = "#7e57c2";
    const ZOOM_R = 21;

    function lineOf(level) {
      if (level === -1) return { s: state.start, e: state.end, div: state.divisions };
      const z = state.zooms[level];
      return { s: z.start, e: z.end, div: 10 };
    }

    // めもりを えらべるのは 水平線より 上だけ。▲は 線より 下なので ぶつからない
    function tickHit(p, div) {
      if (p.y < LINE_Y - 30 || p.y > LINE_Y) return null;
      const gap = SPAN_PX / div;
      for (let i = 0; i <= div; i++) {
        if (Math.abs(p.x - (START_X + i * gap)) <= 13) return i;
      }
      return null;
    }

    function pickTick(level, i) {
      const sel = state.tickSel;
      if (sel && sel.level === level && sel.j === null) {
        if (sel.i === i) { state.tickSel = null; return; }
        if (Math.abs(sel.i - i) === 1) {
          state.tickSel = { level, i: Math.min(sel.i, i), j: Math.max(sel.i, i) };
          return;
        }
      }
      state.tickSel = { level, i, j: null };
    }

    // 拡大できるのは となりどうしで、はばが 10いじょうの とき
    function zoomable(sel) {
      if (!sel || sel.j === null) return null;
      const { s, e, div } = lineOf(sel.level);
      const step = (e - s) / div;
      if (step < 10) return null;
      return { start: s + sel.i * step, end: s + sel.j * step, midX: START_X + (sel.i + sel.j) / 2 * (SPAN_PX / div) };
    }

    function zoomBtnHit(p, level) {
      const sel = state.tickSel;
      if (!sel || sel.level !== level) return false;
      const z = zoomable(sel);
      if (!z) return false;
      return Math.hypot(p.x - z.midX, p.y - (LINE_Y - 30)) <= ZOOM_R + 4;
    }

    function drawSel(g, level) {
      g.textContent = "";
      const sel = state.tickSel;
      if (!sel || sel.level !== level) return;
      const { div } = lineOf(level);
      const gap = SPAN_PX / div;
      const xs = [sel.i, sel.j].filter((v) => v !== null).map((i) => START_X + i * gap);

      if (xs.length === 2) {
        g.appendChild(el("rect", {
          x: Math.min(...xs), y: LINE_Y - 26, width: Math.abs(xs[1] - xs[0]), height: 52,
          fill: SEL_C, "fill-opacity": .14, rx: 6
        }));
      }
      for (const x of xs) {
        g.appendChild(el("line", {
          x1: x, y1: LINE_Y - 30, x2: x, y2: LINE_Y + 30,
          stroke: SEL_C, "stroke-width": 6, "stroke-linecap": "round"
        }));
      }

      const z = zoomable(sel);
      if (!z) return;
      const bx = z.midX, by = LINE_Y - 30;
      g.appendChild(el("circle", {
        cx: bx, cy: by, r: ZOOM_R, fill: "#fff", stroke: SEL_C, "stroke-width": 3
      }));
      g.appendChild(el("circle", {
        cx: bx - 2, cy: by - 2, r: 7.5, fill: "none", stroke: SEL_C, "stroke-width": 2.6
      }));
      g.appendChild(el("line", {
        x1: bx + 3.5, y1: by + 3.5, x2: bx + 9, y2: by + 9,
        stroke: SEL_C, "stroke-width": 3, "stroke-linecap": "round"
      }));
      for (const [x1, y1, x2, y2] of [[bx - 5.5, by - 2, bx + 1.5, by - 2], [bx - 2, by - 5.5, bx - 2, by + 1.5]]) {
        g.appendChild(el("line", { x1, y1, x2, y2, stroke: SEL_C, "stroke-width": 2.4, "stroke-linecap": "round" }));
      }
    }

    function doZoom(level) {
      const z = zoomable(state.tickSel);
      if (!z) return;
      state.zooms = state.zooms.slice(0, level + 1);
      state.zooms.push({ start: z.start, end: z.end, marker: (z.start + z.end) / 2 });
      state.tickSel = null;
      drawSel(selG, -1);
      renderZooms();
    }

    // ── 入力チェック ──
    // 数直線のうえは色でしらせるだけ。なおしかたはテンキーのなかに出す
    const FIELD_NAME = { start: "はじめ", mid: "まんなか", end: "おわり" };
    const PAD_TITLE = {
      start: "はじめの 数", mid: "まんなかの 数", end: "おわりの 数",
      quizNum: "もとの 数", quizAns: "<ruby>約<rt>やく</rt></ruby>の 数",
      target: "しらべたい 数"
    };

    function check() {
      const c = { raw: {}, val: {}, ok: {}, allFilled: true, spanOk: false };
      for (const f of fields()) {
        const raw = state.text[f];
        const v = Number(raw);
        c.raw[f] = raw;
        c.val[f] = v;
        c.ok[f] = raw !== "" && Number.isInteger(v) && v >= 0 && v <= MAX_VALUE && v % 10 === 0;
        if (raw === "") c.allFilled = false;
      }
      if (fields().every((f) => c.ok[f])) {
        if (state.divisions === 10) {
          c.spanOk = STEPS.includes(c.val.end - c.val.start);
        } else {
          const d1 = c.val.mid - c.val.start;
          const d2 = c.val.end - c.val.mid;
          c.spanOk = d1 === d2 && STEPS.includes(d1);
        }
      }
      return c;
    }

    function hintFor(which, c) {
      if (c.raw[which] === "") return "数を いれてね";
      if (c.val[which] % 10 !== 0) return "一のくらいは 0 に してね";
      if (c.val[which] > MAX_VALUE) return "おおきすぎます";
      if (!c.ok[which]) return "この 数は つかえません";
      if (c.spanOk) return "";

      const others = fields().filter((f) => f !== which);
      const bad = others.find((f) => !c.ok[f]);
      if (bad) return FIELD_NAME[bad] + "の 数も なおしてね";

      const seq = fields();
      for (let i = 1; i < seq.length; i++) {
        if (c.val[seq[i]] <= c.val[seq[i - 1]]) {
          return FIELD_NAME[seq[i]] + "は " + FIELD_NAME[seq[i - 1]] + "より 大きく してね";
        }
      }
      if (state.divisions === 20 && c.val.mid - c.val.start !== c.val.end - c.val.mid) {
        return "はじめ→まんなか と まんなか→おわり を おなじ さに してね";
      }
      return "となりどうしの さは 10・100・1000・10000 の どれかに してね";
    }

    function validate() {
      const c = check();

      // からっぽのうちは「まちがい」あつかいにしない
      for (const f of fields()) {
        boxes[f].classList.toggle("invalid",
          c.raw[f] !== "" && (!c.ok[f] || (c.allFilled && !c.spanOk)));
      }

      if (state.editing && QUIZ_FIELDS.includes(state.editing)) {
        // じゆうに書くところなので、なにも言わない
        padDisp.classList.remove("invalid");
        padHint.classList.remove("ok");
        padHint.textContent = "";
      } else if (state.editing) {
        const hint = hintFor(state.editing, c);
        padDisp.classList.toggle("invalid", hint !== "");
        padHint.classList.toggle("ok", hint === "");
        padHint.textContent = hint === "" ? "この 数で つくれます" : hint;
      }

      if (!c.spanOk) return;
      if (c.val.start === state.start && c.val.end === state.end
          && (state.divisions !== 20 || c.val.mid === state.mid)) return;

      state.start = c.val.start;
      state.end = c.val.end;
      state.mid = state.divisions === 20 ? c.val.mid : null;
      state.marker = centerValue();   // はんいが きまったら まんなかに ▲を おく
      state.zooms = [];
      state.tickSel = null;
      renderAll();
      renderZooms();
    }

    // ── こうほ（もとの数から、数直線に入れられる数の くみあわせを つくる） ──
    function candidates() {
      const raw = state.text.quizNum;
      const num = Number(raw);
      if (raw === "" || !Number.isInteger(num)) return [];

      const out = [];
      for (const step of [100000, 10000, 1000, 100, 10]) {
        const lo = Math.floor(num / step) * step;
        if (lo <= 0) continue;
        let anchors;
        if (state.divisions === 20) {
          anchors = lo + 2 * step <= MAX_VALUE ? [lo, lo + step, lo + 2 * step]
                  : (lo - step >= 0 ? [lo - step, lo, lo + step] : null);
        } else {
          anchors = lo + step <= MAX_VALUE ? [lo, lo + step] : null;
        }
        if (anchors) out.push(anchors);
      }
      return out;
    }

    function renderCandBtn() { candBtn.disabled = candidates().length === 0; }

    function openCand() {
      const list = candidates();
      if (!list.length) return;
      closePad();
      candList.textContent = "";
      for (const anchors of list) {
        const item = document.createElement("button");
        item.className = "cand-item";
        item.innerHTML = anchors.map((v) => "<span>" + v + "</span>")
                                .join('<span class="sep">〜</span>');
        item.addEventListener("click", () => applyCandidate(anchors));
        candList.appendChild(item);
      }
      candHold.style.display = "flex";
    }

    function closeCand() { candHold.style.display = "none"; }

    function applyCandidate(anchors) {
      state.text.start = String(anchors[0]);
      state.text.end   = String(anchors[anchors.length - 1]);
      if (state.divisions === 20) state.text.mid = String(anchors[1]);
      state.marker = null;
      clearJudge();
      closeCand();
      refreshText();
      renderAll();
    }

    candBtn.addEventListener("click", openCand);
    document.getElementById("cand-close").addEventListener("click", closeCand);
    document.addEventListener("pointerdown", (ev) => {
      if (candHold.style.display === "none") return;
      if (candEl.contains(ev.target) || candBtn.contains(ev.target)) return;
      closeCand();
    });

    // ── まるつけ ──
    // 何のくらいで四捨五入するかは、となりあうボックスの さ（＝目もりの まとまり）できまる
    // どの くらいで 四捨五入しても、正しければ ○。数直線には よらない
    function correctSet(num) {
      const out = new Set();
      for (let step = 10; step <= 1e8; step *= 10) {
        const r = Math.floor(num / step + 0.5) * step;
        if (r > 0) out.add(r);
        if (step > num) break;
      }
      return out;
    }

    function canJudge() {
      return hasRange() && state.text.quizNum !== "" && state.text.quizAns !== ""
        && Number.isInteger(Number(state.text.quizNum))
        && Number.isInteger(Number(state.text.quizAns));
    }

    function renderJudge() {
      judgeBtn.disabled = !canJudge();
      if (state.judged === null) { judgeMark.textContent = ""; return; }
      judgeMark.innerHTML = state.judged
        ? '<svg width="46" height="46" viewBox="0 0 46 46" role="img" aria-label="せいかい">' +
          '<circle cx="23" cy="23" r="17" fill="none" stroke="#2e7d32" stroke-width="5"/></svg>'
        : '<svg width="46" height="46" viewBox="0 0 46 46" role="img" aria-label="ちがいます">' +
          '<g stroke="#d4574f" stroke-width="5" stroke-linecap="round">' +
          '<line x1="10" y1="10" x2="36" y2="36"/><line x1="36" y1="10" x2="10" y2="36"/></g></svg>';
    }

    function clearJudge() {
      state.judged = null;
      renderJudge();
    }

    judgeBtn.addEventListener("click", () => {
      if (!canJudge()) return;
      const num = Number(state.text.quizNum);
      state.judged = correctSet(num).has(Number(state.text.quizAns));
      renderJudge();
    });

    // ── 数の入力（がめんのテンキー／キーボード） ──
    function refreshText() {
      state.text.quizNum = state.text.target;      // もとの数は しらべたい数の うつし
      boxes.quizAns.disabled = state.text.target === "";
      for (const f of ALL_FIELDS) {
        boxes[f].textContent = state.text[f];
        boxes[f].classList.toggle("empty", state.text[f] === "");
      }
      if (state.editing) {
        padValue.textContent = state.text[state.editing];
      }
      validate();
      renderJudge();
      renderCandBtn();
    }

    function openPad(which) {
      state.editing = which;
      padTitle.innerHTML = PAD_TITLE[which];
      for (const cls of ["mid", "end"]) {
        padTitle.classList.toggle(cls, which === cls);
        padDisp.classList.toggle(cls, which === cls);
      }
      for (const f of ALL_FIELDS) {
        boxes[f].classList.toggle("editing", which === f);
      }
      padHold.style.display = "flex";
      refreshText();
    }

    function closePad() {
      if (!state.editing) return;
      state.editing = null;
      for (const f of ALL_FIELDS) boxes[f].classList.remove("editing");
      padDisp.classList.remove("invalid");
      padHold.style.display = "none";
    }

    function padPress(key) {
      if (!state.editing) return;
      const cur = state.text[state.editing];
      clearJudge();   // 数がかわったら まるつけは やりなおし
      if (key === "clear") state.text[state.editing] = "";
      else if (key === "back") state.text[state.editing] = cur.slice(0, -1);
      else if (cur.length < MAX_DIGITS) state.text[state.editing] = cur === "0" ? key : cur + key;
      refreshText();
    }

    for (const f of ALL_FIELDS) {
      if (f === "quizNum") continue;              // うつしなので ひらかない
      boxes[f].addEventListener("click", () => openPad(f));
    }

    padEl.addEventListener("click", (ev) => {
      const key = ev.target.dataset && ev.target.dataset.key;
      if (key) padPress(key);
    });
    document.getElementById("pad-close").addEventListener("click", closePad);

    // テンキーの そとを さわったら とじる
    document.addEventListener("pointerdown", (ev) => {
      if (!state.editing) return;
      if (padEl.contains(ev.target)) return;
      if (ALL_FIELDS.some((f) => boxes[f].contains(ev.target))) return;
      closePad();
    });

    document.addEventListener("keydown", (ev) => {
      if (!state.editing) return;
      if (ev.key >= "0" && ev.key <= "9") padPress(ev.key);
      else if (ev.key === "Backspace") padPress("back");
      else if (ev.key === "Enter" || ev.key === "Escape") closePad();
      else return;
      ev.preventDefault();
    });

    // ── 拡大した数直線（おなじ SVG のなかに つみあげる）──
    const zoomEls = [];

    function layoutBoxes() {
      const pct = 96.2 / totalH() * 100;       // はしの ボックスの 下ばしを y=96.2 に そろえる
      for (const f of ["start", "mid", "end"]) boxes[f].style.top = pct + "%";
    }

    function renderZooms() {
      svg.setAttribute("viewBox", `0 0 1000 ${totalH()}`);
      layoutBoxes();
      zoomG.textContent = "";
      zoomEls.length = 0;
      state.zooms.forEach((z, k) => {
        const wrap = el("g", { transform: `translate(0, ${LEVEL_H * (k + 1)})` });
        const g = {};
        for (const name of ["bands", "ticks", "labels", "marker", "sel", "ui"]) {
          g[name] = el("g", {});
          wrap.appendChild(g[name]);
        }
        zoomG.appendChild(wrap);
        zoomEls.push({ g });
        drawZoom(k);
      });
      drawLinks();
    }

    // もとの めもりと、拡大した線の はしを うすい点線で つなぐ
    function drawLinks() {
      linksG.textContent = "";
      state.zooms.forEach((z, k) => {
        const par = lineOf(k - 1);
        if (par.s === null || par.e === null) return;
        const y1 = LEVEL_H * k + LINE_Y;
        const y2 = LEVEL_H * (k + 1) + LINE_Y;
        for (const [v, cx] of [[z.start, START_X], [z.end, END_X]]) {
          linksG.appendChild(el("line", {
            x1: xOf(v, par.s, par.e), y1, x2: cx, y2,
            stroke: "#9aa5b1", "stroke-width": 2,
            "stroke-dasharray": "6 8", opacity: .6
          }));
        }
      });
    }

    function drawZoom(k) {
      const z = state.zooms[k];
      const { g } = zoomEls[k];
      const s = z.start, e = z.end, div = 10;
      const gap = SPAN_PX / div, step = (e - s) / div;
      for (const name of ["bands", "ticks", "labels", "marker", "ui"]) g[name].textContent = "";

      // はしの 数（かえられないので わくだけ）
      for (const [v, x, col] of [[s, START_X, "#1e88e5"], [e, END_X, "#ef8b25"]]) {
        const txt = String(v);
        const w = Math.max(86, 34 + txt.length * 16);
        g.ui.appendChild(el("rect", {
          x: x - w / 2, y: 55, width: w, height: 42, rx: 12,
          fill: "#fff", stroke: col, "stroke-width": 3
        }));
        const t = el("text", {
          x, y: 84, "text-anchor": "middle", "font-size": 23, "font-weight": 800, fill: "#1f2933"
        });
        t.textContent = txt;
        g.ui.appendChild(t);
      }

      g.ticks.appendChild(el("line", {
        x1: LINE_X0, y1: LINE_Y, x2: LINE_X1, y2: LINE_Y, stroke: "#1f2933", "stroke-width": 3
      }));
      const fs = fsFor(e, div);
      for (let i = -1; i <= div + 1; i++) {
        const x = START_X + i * gap;
        const inRange = i >= 0 && i <= div;
        const isEdge = i === 0 || i === div;
        if (!state.showTicks && !isEdge) continue;
        g.ticks.appendChild(el("line", {
          x1: x, y1: LINE_Y - (isEdge ? 24 : 13), x2: x, y2: LINE_Y + (isEdge ? 24 : 13),
          stroke: inRange ? "#1f2933" : "#b0bac4",
          "stroke-width": isEdge ? 4 : 2.5, "stroke-linecap": "round"
        }));
        if (!inRange || isEdge) continue;
        const label = el("text", {
          x, y: LABEL_Y, "text-anchor": "middle",
          "font-size": fs, "font-weight": 700, fill: "#52606d"
        });
        label.textContent = String(s + i * step);
        g.labels.appendChild(label);
      }

      const mx = xOf(z.marker, s, e);
      g.bands.appendChild(el("rect", {
        x: START_X, y: BAND_TOP, width: Math.max(0, mx - START_X), height: BAND_H,
        fill: "#64b5f6", "fill-opacity": 0.32
      }));
      g.bands.appendChild(el("rect", {
        x: mx, y: BAND_TOP, width: Math.max(0, END_X - mx), height: BAND_H,
        fill: "#ffb74d", "fill-opacity": 0.45
      }));
      g.bands.appendChild(el("line", {
        x1: mx, y1: BAND_TOP, x2: mx, y2: LINE_Y, stroke: "#e57373", "stroke-width": 2.5
      }));

      const top = LINE_Y + TRI_GAP;
      g.marker.appendChild(el("polygon", {
        points: `${mx},${top} ${mx - TRI_SIDE / 2},${top + TRI_H} ${mx + TRI_SIDE / 2},${top + TRI_H}`,
        fill: "#e57373", stroke: "#cf6161", "stroke-width": 1.5, "stroke-linejoin": "round"
      }));
      const txt = String(z.marker);
      const w = 30 + txt.length * 15;
      const bx = Math.min(END_X + 40 - w, Math.max(START_X - 40, mx - w / 2));
      const by = top + TRI_H + 8;
      const on = z.marker === targetIn(s, e);
      g.marker.appendChild(el("rect", {
        x: bx, y: by, width: w, height: 40, rx: 10,
        fill: "#fff", stroke: on ? "#8bc34a" : "#e57373", "stroke-width": on ? 3.5 : 2.5
      }));
      const mt = el("text", {
        x: bx + w / 2, y: by + 28, "text-anchor": "middle",
        "font-size": 23, "font-weight": 900, fill: on ? "#5f8f2e" : "#c96060"
      });
      mt.textContent = txt;
      g.marker.appendChild(mt);

      g.ui.appendChild(el("circle", {
        cx: 962, cy: 30, r: 16, fill: "#fff", stroke: "#b0bac4", "stroke-width": 2.5
      }));
      for (const [a, b2] of [[-6, -6], [6, -6]]) {
        g.ui.appendChild(el("line", {
          x1: 962 + a, y1: 30 + b2, x2: 962 - a, y2: 30 - b2,
          stroke: "#6b7280", "stroke-width": 2.6, "stroke-linecap": "round"
        }));
      }

      drawSel(g.sel, k);
    }

    function refreshSel() {
      drawSel(selG, -1);
      zoomEls.forEach((z, k) => drawSel(z.g.sel, k));
    }

    // ── ポインタ操作 ──
    // どの 数直線を さわったか（-1 = いちばん上）
    function levelAt(p) { return Math.floor(p.y / LEVEL_H) - 1; }
    function localPt(p, level) { return { x: p.x, y: p.y - LEVEL_H * (level + 1) }; }

    let dragging = null;      // さわっている 数直線の level

    svg.addEventListener("pointerdown", (ev) => {
      closePad();
      if (!hasRange()) return;
      const g = svgPt(ev);
      const level = levelAt(g);
      if (level >= state.zooms.length) return;
      const p = localPt(g, level);

      if (level >= 0 && Math.hypot(p.x - 962, p.y - 30) <= 20) {   // とじる
        state.zooms = state.zooms.slice(0, level);
        if (state.tickSel && state.tickSel.level >= level) state.tickSel = null;
        renderZooms();
        drawSel(selG, -1);
        return;
      }
      if (zoomBtnHit(p, level)) { doZoom(level); return; }
      const ti = tickHit(p, lineOf(level).div);
      if (ti !== null) { pickTick(level, ti); refreshSel(); return; }

      dragging = level;
      svg.classList.add("dragging");
      svg.setPointerCapture(ev.pointerId);
      setMarker(level, p.x);
    });

    svg.addEventListener("pointermove", (ev) => {
      if (dragging === null) return;
      const g = svgPt(ev);
      setMarker(dragging, localPt(g, dragging).x);
    });

    function setMarker(level, x) {
      const { s, e } = lineOf(level);
      const v = vOf(x, s, e);
      if (level < 0) {
        if (v === state.marker) return;
        state.marker = v;
        renderMarker();
        drawSel(selG, -1);
      } else {
        if (v === state.zooms[level].marker) return;
        state.zooms[level].marker = v;
        drawZoom(level);
      }
    }

    function endDrag(ev) {
      if (dragging === null) return;
      dragging = null;
      svg.classList.remove("dragging");
      if (svg.hasPointerCapture(ev.pointerId)) svg.releasePointerCapture(ev.pointerId);
    }
    svg.addEventListener("pointerup", endDrag);
    svg.addEventListener("pointercancel", endDrag);

    tickBtn.addEventListener("click", () => {
      state.showTicks = !state.showTicks;
      tickBtn.setAttribute("aria-pressed", String(!state.showTicks));
      const label = state.showTicks ? "あいだの めもりを けす" : "あいだの めもりを だす";
      tickBtn.setAttribute("aria-label", label);
      tickBtn.title = label;
      renderAll();
      state.zooms.forEach((_, k) => drawZoom(k));
    });

    clearBtn.addEventListener("click", () => {
      state.marker = null;
      renderMarker();
    });

    // ── めもりの かずの きりかえ（10分割／20分割） ──
    document.querySelectorAll(".seg-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const d = Number(btn.dataset.div);
        if (d === state.divisions) return;
        state.divisions = d;
        document.querySelectorAll(".seg-btn").forEach((b) => {
          b.setAttribute("aria-pressed", String(Number(b.dataset.div) === d));
        });
        boxes.mid.style.display = d === 20 ? "" : "none";
        // いまの数がこの分割では つかえないなら、いったん未かくていに もどす
        if (!check().spanOk) { state.start = null; state.mid = null; state.end = null; }
        state.marker = null;
        state.zooms = [];
        state.tickSel = null;
        clearJudge();
        closeCand();
        refreshText();
        if (hasRange() && state.marker === null) state.marker = centerValue();
        renderAll();
        renderZooms();
      });
    });

    refreshText();
    renderAll();
    renderZooms();
  </script>
